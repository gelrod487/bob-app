<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BOB — Reset Password</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#A63D40">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="BOB">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="stylesheet" href="/css/bob.css">
</head>
<body>
<div class="auth-wrap" style="flex-direction:column; gap:14px;">
  <div style="width:100%; max-width:420px;">
    <a class="ghost" href="/" style="font-size:.85rem; padding:8px 14px;">← Back home</a>
  </div>
  <div class="auth-card">
    <div class="brand" style="margin-bottom:20px;">
      <div id="navMascot" style="width:34px; height:45px;"></div>
      <div><h1 style="font-size:1.3rem; margin:0;">Set a new password</h1></div>
    </div>

    <p class="helptext" id="checkingNotice">Verifying your reset link…</p>

    <form class="auth-form section-hidden" id="resetForm">
      <div><label>New Password</label><input required type="password" name="password" placeholder="At least 6 characters" minlength="6"></div>
      <div><label>Confirm Password</label><input required type="password" name="confirmPassword" placeholder="Retype your new password" minlength="6"></div>
      <button class="primary" type="submit">Update Password</button>
      <div class="errortext" id="resetError"></div>
      <div class="helptext" id="resetNotice"></div>
    </form>

    <p class="helptext section-hidden" id="invalidLinkNotice">This password reset link is invalid or has expired. <a class="link-accent" href="/login.html">Go back to sign in</a> and request a new one.</p>
  </div>
</div>

<script src="/js/supabaseClient.js"></script>
<script src="/js/mascot.js"></script>
<script src="/js/registerSW.js"></script>
<script>
wireMascot('navMascot', ["Almost there!", "Pick something you'll remember."]);

const resetForm = document.getElementById('resetForm');
const checkingNotice = document.getElementById('checkingNotice');
const invalidLinkNotice = document.getElementById('invalidLinkNotice');

let recoveryReady = false;
function showResetForm() {
  if (recoveryReady) return;
  recoveryReady = true;
  checkingNotice.classList.add('section-hidden');
  invalidLinkNotice.classList.add('section-hidden');
  resetForm.classList.remove('section-hidden');
}

// Supabase's recovery link either lands as a #access_token=...&type=recovery fragment
// (fires the PASSWORD_RECOVERY auth event once the client parses it) or as a ?code=...
// query param (PKCE — needs an explicit exchange). Handle both.
supabaseClient.auth.onAuthStateChange((event) => {
  if (event === 'PASSWORD_RECOVERY') showResetForm();
});

(async () => {
  const params = new URLSearchParams(window.location.search);
  if (params.get('code')) {
    const { error } = await supabaseClient.auth.exchangeCodeForSession(window.location.href);
    if (!error) showResetForm();
  }
  // Give the client a moment to finish parsing the URL before deciding the link is bad.
  setTimeout(async () => {
    if (recoveryReady) return;
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) { showResetForm(); return; }
    checkingNotice.classList.add('section-hidden');
    invalidLinkNotice.classList.remove('section-hidden');
  }, 1500);
})();

resetForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = new FormData(e.target);
  const errEl = document.getElementById('resetError');
  const noticeEl = document.getElementById('resetNotice');
  errEl.textContent = ''; noticeEl.textContent = '';

  if (f.get('password') !== f.get('confirmPassword')) {
    errEl.textContent = 'Passwords do not match.';
    return;
  }

  const { error } = await supabaseClient.auth.updateUser({ password: f.get('password') });
  if (error) { errEl.textContent = error.message; return; }

  noticeEl.textContent = 'Password updated! Redirecting…';
  setTimeout(() => { window.location.href = '/app.html'; }, 1200);
});
</script>
</body>
</html>
