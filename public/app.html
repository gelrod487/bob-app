<script src="/js/supabaseClient.js"></script>
<script src="/js/api.js"></script>
<script src="/js/mascot.js"></script>
<script>
let me = null;
let policiesCache = [];
let clientsCache = [];
const COST_CATEGORIES = [
  { key:'Lead flow',      color:'#7A3B4A' },
  { key:'Marketing',      color:'#A63D40' },
  { key:'E&O insurance',  color:'#D8CBB8' },
  { key:'Licenses',       color:'#9A8F7C' },
  { key:'CRM/Tools',      color:'#7C9473' },
  { key:'Office',         color:'#D4A373' },
  { key:'Travel',         color:'#C9986B' },
  { key:'Staff',          color:'#5F7A6E' },
  { key:'Insurance',      color:'#8C5B63' },
  { key:'Other',          color:'#B7ADA0' },
];
function costColor(cat){ return (COST_CATEGORIES.find(c=>c.key===cat) || {}).color || '#B7ADA0'; }
const STATUS_TAG = {
  active: { cls: 'active-pol', label: 'Issued — paid' },
  pending: { cls: 'pending', label: 'Pending' },
  lapsed: { cls: 'lapsed', label: 'Lapsed' },
  declined: { cls: 'lapsed', label: 'Declined' },
  withdrawn: { cls: 'lapsed', label: 'Withdrawn' },
};

function fmt(n){ return '$'+Number(n||0).toLocaleString(undefined,{maximumFractionDigits:0}); }
function fmtMoney2(n){ return '$'+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2}); }
function fmtDate(dateStr){ return new Date(dateStr).toLocaleDateString(undefined,{timeZone:'UTC', month:'short', day:'numeric'}); }
function pct(a,b){ return b ? ((a/b)*100).toFixed(1)+'%' : '0%'; }
function toISO(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function todayISO(){ return toISO(new Date()); }
function monthFirstISO(){ const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`; }
function policyChargeback(p){ return (p.commissionEntries||[]).filter(e=>e.entryType==='chargeback').reduce((s,e)=>s+Math.abs(Number(e.amount)),0); }

/* ---- shared date-range report filter (Desk, Activity, Costs, Profit) ---- */
const DATE_RANGE_PRESETS = [
  ['today','Today'], ['yesterday','Yesterday'], ['this_week','This week'], ['this_month','This month'],
  ['last_month','Last month'], ['this_quarter','This quarter'], ['ytd','Year to date'], ['custom','Custom'],
];
const dateFilterState = {
  desk: { key: 'this_month', from: '', to: '' },
  activity: { key: 'this_month', from: '', to: '' },
  book: { key: 'ytd', from: '', to: '' },
  costs: { key: 'this_month', from: '', to: '' },
  profit: { key: 'this_month', from: '', to: '' },
};
function computeDateRange(key, customFrom, customTo){
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth(), d = now.getDate();
  switch (key) {
    case 'today': { const t = toISO(now); return { from: t, to: t }; }
    case 'yesterday': { const t = toISO(new Date(y,m,d-1)); return { from: t, to: t }; }
    case 'this_week': { const start = new Date(y,m,d - now.getDay()); return { from: toISO(start), to: toISO(now) }; }
    case 'last_month': return { from: toISO(new Date(y,m-1,1)), to: toISO(new Date(y,m,0)) };
    case 'this_quarter': { const q = Math.floor(m/3); return { from: toISO(new Date(y,q*3,1)), to: toISO(now) }; }
    case 'ytd': return { from: toISO(new Date(y,0,1)), to: toISO(now) };
    case 'custom': return { from: customFrom || toISO(new Date(y,m,1)), to: customTo || toISO(now) };
    case 'this_month': default: return { from: toISO(new Date(y,m,1)), to: toISO(now) };
  }
}
function dateFilterHTML(pageKey){
  const state = dateFilterState[pageKey];
  const range = computeDateRange(state.key, state.from, state.to);
  return `
  <div class="date-filter" data-page="${pageKey}">
    <select class="date-filter-select">
      ${DATE_RANGE_PRESETS.map(([k,label]) => `<option value="${k}" ${state.key===k?'selected':''}>${label}</option>`).join('')}
    </select>
    <span class="date-filter-custom${state.key==='custom' ? '' : ' section-hidden'}">
      <input type="date" class="date-filter-from" value="${range.from}">
      <span>to</span>
      <input type="date" class="date-filter-to" value="${range.to}">
      <button type="button" class="ghost date-filter-apply">Apply</button>
    </span>
    <span class="date-filter-range helptext">${fmtDate(range.from)} – ${fmtDate(range.to)}</span>
  </div>`;
}
function wireDateFilter(pageKey, onChange){
  const wrap = mainInner.querySelector(`.date-filter[data-page="${pageKey}"]`);
  if (!wrap) return;
  const state = dateFilterState[pageKey];
  const select = wrap.querySelector('.date-filter-select');
  const custom = wrap.querySelector('.date-filter-custom');
  select.onchange = () => {
    state.key = select.value;
    if (state.key === 'custom') { custom.classList.remove('section-hidden'); return; }
    onChange();
  };
  wrap.querySelector('.date-filter-apply').onclick = () => {
    state.from = wrap.querySelector('.date-filter-from').value;
    state.to = wrap.querySelector('.date-filter-to').value;
    onChange();
  };
}

/* ---- modal helper (add client, client detail, log a day, add cost) ---- */
function openModal(innerHTML, opts){
  closeModal();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'activeModal';
  overlay.innerHTML = `<div class="modal-box${opts && opts.wide ? ' modal-wide' : ''}">${innerHTML}</div>`;
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
  document.body.appendChild(overlay);
  return overlay;
}
function closeModal(){ const m = document.getElementById('activeModal'); if (m) m.remove(); }

/* ---- BOB mascot (lives top-left in the sidebar) ---- */
const say = wireMascot('navMascot', ["Hi, I'm Bob!","Bump your dials — I'll do the math.","Looking sharp today!","Don't forget to log your lead costs."]);

/* ---- sidebar nav ---- */
const mainInner = document.getElementById('mainInner');
const PAGES = { desk: renderDesk, activity: renderActivity, book: () => renderBook('',''), costs: renderCosts, profit: renderProfit, subscribe: renderSubscribe, settings: renderSettings };
let currentPage = 'desk';
function renderCurrentPage(){ PAGES[currentPage](); }
function go(page){
  currentPage = page;
  document.querySelectorAll('#sidebarNav button, .sidebar-footer button[data-page]').forEach(b => b.classList.toggle('active', b.dataset.page === page));
  PAGES[page]();
}
document.querySelectorAll('#sidebarNav button, .sidebar-footer button[data-page]').forEach(b => b.onclick = () => go(b.dataset.page));
document.getElementById('logoutBtn').onclick = async () => { await supabaseClient.auth.signOut(); window.location.href = '/login.html'; };

/* ---- boot ---- */
(async function init(){
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (!session) { window.location.href = '/login.html'; return; }
  const meRes = await apiFetch('/api/me');
  if (!meRes.producer) { window.location.href = '/login.html'; return; }
  me = meRes.producer;

  const statusPill = document.getElementById('sidebarStatusPill');
  statusPill.textContent = me.subscriptionStatus;
  statusPill.className = 'pill ' + me.subscriptionStatus;

  setTimeout(()=>say("Hi, I'm Bob!"), 900);
  go('desk');
})();

/* ================= DESK ================= */
async function renderDesk(){
  mainInner.innerHTML = `<div class="page-header"><div><div class="page-eyebrow">Desk</div><h1>${me.name.split(' ')[0]}'s book</h1></div></div><p class="helptext">Loading…</p>`;

  const range = computeDateRange(dateFilterState.desk.key, dateFilterState.desk.from, dateFilterState.desk.to);
  const [dash, dashMonth, expenses, policies, activityAll, activityRange, goal] = await Promise.all([
    apiFetch(`/api/dashboard?from=${range.from}&to=${range.to}`),
    apiFetch(`/api/dashboard?from=${monthFirstISO()}&to=${todayISO()}`),
    apiFetch(`/api/expenses?from=${range.from}&to=${range.to}`),
    apiFetch('/api/policies'),
    apiFetch('/api/activity'),
    apiFetch(`/api/activity?from=${range.from}&to=${range.to}`),
    apiFetch(`/api/goals?month=${monthFirstISO()}`),
  ]);
  policiesCache = policies;

  const funnel = activityRange.reduce((s,r) => ({
    dials: s.dials + r.dials, appointments: s.appointments + r.appointments,
    presentations: s.presentations + r.presentations, sales: s.sales + r.sales,
  }), { dials:0, appointments:0, presentations:0, sales:0 });

  const monthKey = todayISO().slice(0,7);
  const monthActivity = activityAll.filter(r => r.date.slice(0,7) === monthKey)
    .reduce((s,r) => ({ dials:s.dials+r.dials, appointments:s.appointments+r.appointments, presentations:s.presentations+r.presentations, sales:s.sales+r.sales }), {dials:0,appointments:0,presentations:0,sales:0});

  const t = todayRow(activityAll);

  const costLines = COST_CATEGORIES.map(c => ({ cat:c.key, color:c.color, total: expenses.filter(e=>e.category===c.key).reduce((s,e)=>s+Number(e.amount),0) })).filter(c=>c.total>0);

  const recent = [...policies].sort((a,b)=>new Date(b.issueDate)-new Date(a.issueDate)).slice(0,5);

  mainInner.innerHTML = `
    <div class="page-header"><div><div class="page-eyebrow">Desk</div><h1>${me.name.split(' ')[0]}'s book</h1></div>
    <button class="ghost" type="button" id="addClientBtn">+ Add a client</button></div>

    ${dateFilterHTML('desk')}

    <div class="grid" style="margin-bottom:18px;">
      <div class="card"><div class="stat-label">Net Profit</div><div class="stat-value ${dash.netProfit>=0?'pos':'neg'}">${fmt(dash.netProfit)}</div><div class="stat-sub">After chargebacks and costs</div></div>
      <div class="card"><div class="stat-label">Gross Commission</div><div class="stat-value">${fmt(dash.grossCommission)}</div><div class="stat-sub">${dash.placedCount} placed · ${fmt(dash.pendingPremium)} pending</div></div>
      <div class="card"><div class="stat-label">Chargebacks</div><div class="stat-value neg">−${fmt(dash.chargebacks)}</div><div class="stat-sub">from lapsed cases</div></div>
      <div class="card"><div class="stat-label">Operating Costs</div><div class="stat-value">${fmt(dash.totalExpenses)}</div><div class="stat-sub">${dash.placedCount ? fmt(dash.totalExpenses/dash.placedCount)+' / sale' : '—'}</div></div>
    </div>

    <div class="panel">
      <h2>Today</h2>
      <div class="stepper-grid">
        ${['dials','appointments','presentations','sales'].map(f => `
          <div class="stepper-box">
            <button class="stepper-btn" data-field="${f}" data-delta="-1">−</button>
            <div class="count-wrap"><span class="count" id="today-${f}">${t[f]}</span><span class="count-label">${f}</span></div>
            <button class="stepper-btn" data-field="${f}" data-delta="1">+</button>
          </div>`).join('')}
      </div>
    </div>

    <div class="panel">
      <h2>Production funnel</h2>
      <p class="helptext" style="margin:-8px 0 14px;">${funnel.dials} dials · ${funnel.appointments} set · ${funnel.presentations} sits · ${funnel.sales} sales (${fmtDate(range.from)}–${fmtDate(range.to)})</p>
      ${funnelRow('Dials', funnel.dials, funnel.dials, null)}
      ${funnelRow('Appointments set', funnel.appointments, funnel.dials, pct(funnel.appointments,funnel.dials))}
      ${funnelRow('Presentations', funnel.presentations, funnel.dials, pct(funnel.presentations,funnel.appointments))}
      ${funnelRow('Sales', funnel.sales, funnel.dials, pct(funnel.sales,funnel.presentations))}
      <p class="helptext">${pct(funnel.sales,funnel.dials)} of dials became a sale.</p>

      <div class="goal-grid">
        ${goalCell('Dials', monthActivity.dials, goal.dialsTarget)}
        ${goalCell('Appts', monthActivity.appointments, goal.appointmentsTarget)}
        ${goalCell('Sits', monthActivity.presentations, goal.sitsTarget)}
        ${goalCell('Sales', monthActivity.sales, goal.salesTarget)}
        ${goalCell('FYC', dashMonth.grossCommission, Number(goal.fycTarget), true)}
      </div>
      <p class="helptext" style="margin-top:10px;"><a href="#" onclick="go('settings');return false;" style="color:var(--maroon); font-weight:700; text-decoration:none;">Set this month's goals →</a></p>
    </div>

    <div class="panel">
      <h2>Net by month</h2>
      <p class="helptext" style="margin:-8px 0 14px;">Commission minus chargebacks and overhead</p>
      <div class="chart-box"><canvas id="netChart"></canvas></div>
    </div>

    <div class="panel">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;"><h2 style="margin:0;">Recent cases</h2><a href="#" onclick="go('book');return false;" style="font-size:.85rem; font-weight:700; color:var(--maroon); text-decoration:none;">Open book</a></div>
      ${recent.map(caseCardFromPolicy).join('') || '<p class="helptext">No cases yet — add your first client on the Book page.</p>'}
    </div>

    <div class="panel">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;"><h2 style="margin:0;">Where the money goes</h2><a href="#" onclick="go('costs');return false;" style="font-size:.85rem; font-weight:700; color:var(--maroon); text-decoration:none;">All costs</a></div>
      ${costLines.length ? donutBlock(costLines) : '<p class="helptext">No costs logged yet.</p>'}
    </div>
  `;

  wireDateFilter('desk', renderDesk);
  document.getElementById('addClientBtn').onclick = openAddClientModal;
  document.querySelectorAll('.stepper-btn').forEach(btn => btn.onclick = () => bumpActivity(btn.dataset.field, Number(btn.dataset.delta)));
  renderNetChart(await monthlySeries());
  if (costLines.length) renderDonut('donutCanvas', costLines);
}

function todayRow(rows){
  const iso = todayISO();
  return rows.find(r => r.date.slice(0,10) === iso) || { dials:0, appointments:0, presentations:0, sales:0 };
}
async function bumpActivity(field, delta){
  const row = await apiFetch('/api/activity/increment', { method:'POST', body:{ date: todayISO(), field, delta } });
  document.getElementById('today-'+field).textContent = row[field];
  renderDesk(); // cheap full refresh keeps funnel/goal math in sync
}

function funnelRow(label, value, total, conv){
  return `<div class="funnel-row">
    <div class="row-top"><span>${label}</span><span>${value}${conv ? ` <span class="conv">· ${conv} conv</span>`:''}</span></div>
    <div class="bar-track"><div class="bar-fill" style="width:${total ? Math.min(100,(value/total*100)) : 0}%"></div></div>
  </div>`;
}
function goalCell(label, have, target, isMoney){
  const pctVal = target ? Math.min(100, (have/target)*100) : 0;
  return `<div class="goal-cell">
    <div class="glabel">${label}</div>
    <div class="gvalue">${isMoney ? fmt(have) : have} / ${isMoney ? fmt(target) : target}</div>
    <div class="bar-track"><div class="bar-fill" style="width:${pctVal}%"></div></div>
  </div>`;
}
function caseCardFromPolicy(p){
  const tag = STATUS_TAG[p.status] || STATUS_TAG.pending;
  const cb = policyChargeback(p);
  return `<div class="case-card">
    <div><button class="case-name-link" onclick="openClientDetail('${p.id}')">${p.client?.name || '—'}</button><div class="case-sub">${p.productType} · ${p.carrier} · ${fmtDate(p.issueDate)}</div></div>
    <div class="case-right">
      <div class="case-amount">${fmt(Number(p.monthlyPremium)*12)}</div>
      <div style="margin-top:4px;"><span class="tag ${tag.cls}">${tag.label}</span>${cb ? ` <span class="helptext" style="color:var(--red);">−${fmt(cb)} CB</span>`:''}</div>
    </div>
  </div>`;
}
function donutBlock(costLines){
  return `<div class="donut-wrap">
    <div class="chart-box" style="width:180px; height:180px; flex-shrink:0;"><canvas id="donutCanvas"></canvas></div>
    <div class="donut-legend">
      ${costLines.map(c => `<div class="donut-legend-row"><span><span class="dot" style="background:${c.color}"></span>${c.cat}</span><span>${fmt(c.total)}</span></div>`).join('')}
    </div>
  </div>`;
}

let netChart, donutChart;
async function monthlySeries(){
  const [expenses, commissions] = await Promise.all([apiFetch('/api/expenses'), apiFetch('/api/commission-entries')]);
  const months = [];
  const now = new Date();
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    months.push({ key: `${d.getFullYear()}-${d.getMonth()}`, label: d.toLocaleString(undefined,{month:'short'}) });
  }
  const monthKey = (dateStr) => { const d = new Date(dateStr); return `${d.getFullYear()}-${d.getMonth()}`; };
  const data = months.map(m => {
    const rev = commissions.filter(c => monthKey(c.entryDate) === m.key).reduce((s,c)=>s+Number(c.amount),0);
    const exp = expenses.filter(e => monthKey(e.expenseDate) === m.key).reduce((s,e)=>s+Number(e.amount),0);
    return rev - exp;
  });
  return { labels: months.map(m=>m.label), data };
}
function renderNetChart(series){
  const ctx = document.getElementById('netChart');
  if (!ctx) return;
  if (netChart) netChart.destroy();
  netChart = new Chart(ctx, { type:'line', data:{ labels: series.labels, datasets:[{
    data: series.data, borderColor:'#1B7A73', backgroundColor:'rgba(27,122,115,.15)',
    fill:true, tension:.45, cubicInterpolationMode:'monotone', pointRadius:0,
  }]}, options:{ responsive:true, maintainAspectRatio:false,
    plugins:{ legend:{ display:false } },
    scales:{ x:{ ticks:{ color:getComputedStyle(document.body).color } }, y:{ ticks:{ color:getComputedStyle(document.body).color } } } } });
}
function renderDonut(id, costLines){
  const ctx = document.getElementById(id);
  if (!ctx) return;
  if (donutChart) donutChart.destroy();
  donutChart = new Chart(ctx, { type:'doughnut', data:{
    labels: costLines.map(c=>c.cat), datasets:[{ data: costLines.map(c=>c.total), backgroundColor: costLines.map(c=>c.color) }]
  }, options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ display:false } }, cutout:'68%' } });
}

/* ================= ADD CLIENT (Desk + Book) ================= */
function openAddClientModal(){
  openModal(`
    <div class="modal-head"><h2>Add a client</h2><button class="modal-close" onclick="closeModal()">×</button></div>
    <form id="addClientForm">
      <div class="detail-grid">
        <div class="full" style="grid-column:1/-1;"><label>Client Name</label><input required name="name" placeholder="Jordan Alvarez"></div>
        <div><label>Email</label><input type="email" name="email" placeholder="jordan@example.com"></div>
        <div><label>Phone</label><input name="phone" placeholder="(555) 555-0100"></div>
        <div><label>Carrier</label><input required name="carrier" placeholder="e.g. North Star Life"></div>
        <div><label>Product Type</label><input required name="product" placeholder="e.g. Term 20"></div>
        <div><label>Monthly Premium ($)</label><input required type="number" step="0.01" name="premium" placeholder="150"></div>
        <div><label>Status</label><select name="status"><option value="active">Issued — paid</option><option value="pending">Pending</option></select></div>
        <div><label>Lead Vendor</label><input name="leadVendor" placeholder="e.g. Facebook Leads"></div>
        <div><label>Lead Type</label><input name="leadType" placeholder="e.g. Final Expense"></div>
        <div class="full" style="grid-column:1/-1;"><label>Date Submitted</label><input required type="date" name="dateSubmitted" value="${todayISO()}"></div>
        <div class="full" style="grid-column:1/-1;"><label>Notes</label><input name="notes" placeholder="Optional"></div>
      </div>
      <div class="modal-actions"><button class="primary" type="submit">Add Client</button><button class="ghost" type="button" onclick="closeModal()">Cancel</button></div>
      <div class="errortext" id="addClientError"></div>
    </form>
  `);
  document.getElementById('addClientForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errEl = document.getElementById('addClientError');
    errEl.textContent = '';
    const f = new FormData(e.target);
    const status = f.get('status');
    const dateSubmitted = f.get('dateSubmitted');
    const isPlaced = status === 'active';
    try {
      const client = await apiFetch('/api/clients', { method:'POST', body:{ name: f.get('name'), email: f.get('email')||null, phone: f.get('phone')||null } });
      clientsCache.push(client);
      await apiFetch('/api/policies', { method:'POST', body:{
        clientId: client.id, carrier: f.get('carrier'), productType: f.get('product'),
        monthlyPremium: Number(f.get('premium')), issueDate: dateSubmitted, status,
        leadVendor: f.get('leadVendor')||null, leadType: f.get('leadType')||null,
        dateSubmitted, approvedDate: isPlaced ? dateSubmitted : null, notes: f.get('notes')||null,
      }});
      closeModal();
      say('Client added!');
      renderCurrentPage();
    } catch (err) { errEl.textContent = err.message; }
  });
}

/* ================= CLIENT DETAIL ================= */
async function openClientDetail(policyId){
  let p = policiesCache.find(x => x.id === policyId);
  if (!p) {
    policiesCache = await apiFetch('/api/policies');
    p = policiesCache.find(x => x.id === policyId);
  }
  if (!p) return;
  const tag = STATUS_TAG[p.status] || STATUS_TAG.pending;
  const contact = p.client?.contactInfo || {};
  const paidSoFar = (p.commissionEntries||[]).filter(e=>['advance','additional','override'].includes(e.entryType)).reduce((s,e)=>s+Number(e.amount),0);
  const cb = policyChargeback(p);

/* ---- CSV import (unchanged logic, just re-skinned) ---- */
const IMPORT_FIELDS = [
  ['clientName','Client Name'], ['phone','Phone'], ['email','Email'], ['carrier','Carrier'],
  ['policyNumber','Policy Number'], ['productType','Product Type'], ['faceAmount','Face Amount'],
  ['monthlyPremium','Monthly Premium'], ['issueDate','Issue Date'], ['status','Status'],
  ['leadType','Lead Type'], ['leadVendor','Lead Vendor'],
  ['advanceCommission','Initial Commission'], ['additionalCommission','Additional Commission'], ['chargeback','Chargeback'],
];
let importRows = [];
function wireImport(){
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  if (!dropzone) return;
  dropzone.onclick = ()=>fileInput.click();
  ['dragover','dragenter'].forEach(ev=>dropzone.addEventListener(ev,e=>{e.preventDefault();dropzone.classList.add('drag');}));
  ['dragleave','drop'].forEach(ev=>dropzone.addEventListener(ev,e=>{e.preventDefault();dropzone.classList.remove('drag');}));
  dropzone.addEventListener('drop', e=>{ if(e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });
  fileInput.addEventListener('change', e=>{ if(e.target.files[0]) handleFile(e.target.files[0]); });
}
let importWorkbook = null;
function handleFile(file){
  const isExcel = /\.xlsx?$/i.test(file.name);
  if (!isExcel) {
    Papa.parse(file, { header:true, skipEmptyLines:true, complete: async (res) => {
      importRows = res.data;
      const suggestion = await apiFetch('/api/import/suggest-mapping', { method:'POST', body:{ rows: importRows } });
      renderMapper(suggestion);
    }});
    return;
  }
  const reader = new FileReader();
  reader.onload = async (e) => {
    importWorkbook = XLSX.read(e.target.result, { type: 'array' });
    if (importWorkbook.SheetNames.length === 1) {
      await loadSheet(importWorkbook.SheetNames[0]);
    } else {
      renderSheetPicker(importWorkbook.SheetNames);
    }
  };
  reader.readAsArrayBuffer(file);
}
async function loadSheet(sheetName){
  const rows = XLSX.utils.sheet_to_json(importWorkbook.Sheets[sheetName], { defval: '', raw: false });
  importRows = rows;
  const area = document.getElementById('mapArea');
  area.innerHTML = '<p class="helptext">Reading sheet…</p>';
  const suggestion = await apiFetch('/api/import/suggest-mapping', { method:'POST', body:{ rows: importRows } });
  renderMapper(suggestion, sheetName);
}
function renderSheetPicker(sheetNames){
  const area = document.getElementById('mapArea');
  area.innerHTML = `<h3 style="margin-top:0;">Which tab has your client &amp; case data?</h3>
    <p class="helptext">This workbook has ${sheetNames.length} tabs. Pick the one to import — you can come back and import another tab afterward.</p>
    <select id="sheetPicker">${sheetNames.map(n=>`<option value="${n}">${n}</option>`).join('')}</select>
    <button class="primary" id="loadSheetBtn" type="button" style="margin-left:8px;">Use this tab</button>`;
  document.getElementById('loadSheetBtn').onclick = () => loadSheet(document.getElementById('sheetPicker').value);
}
function renderMapper(suggestion, sheetName){
  const { headers, suggestedMapping, totalRows } = suggestion;
  const area = document.getElementById('mapArea');
  const multiSheet = importWorkbook && importWorkbook.SheetNames.length > 1;
  area.innerHTML = `<h3 style="margin-top:0;">Map your columns${sheetName ? ` — "${sheetName}"` : ''}</h3>
    <p class="helptext">${totalRows} rows found. Match each field below to a column from your file, or leave it skipped.</p>
    <div class="grid" style="grid-template-columns:repeat(2,1fr);">
    ${IMPORT_FIELDS.map(([key,label])=>`
      <div><label>${label}</label><select data-key="${key}">
        <option value="">— skip —</option>
        ${headers.map(h=>`<option value="${h}" ${suggestedMapping[key]===h?'selected':''}>${h}</option>`).join('')}
      </select></div>`).join('')}
    </div>
    <div style="margin-top:16px;"><button class="primary" id="confirmImport" type="button">Import ${totalRows} Rows</button>
    <button class="ghost" id="cancelImport" type="button" style="margin-left:8px;">Cancel</button>
    ${multiSheet ? `<button class="ghost" id="pickAnotherSheet" type="button" style="margin-left:8px;">Choose a different tab</button>` : ''}</div>
    <div id="importResult" style="margin-top:14px;"></div>`;
  if (multiSheet) document.getElementById('pickAnotherSheet').onclick = () => renderSheetPicker(importWorkbook.SheetNames);

  document.getElementById('confirmImport').onclick = async () => {
    const mapping = {};
    area.querySelectorAll('select').forEach(s => { if (s.value) mapping[s.dataset.key] = s.value; });
    const summary = await apiFetch('/api/import/commit', { method:'POST', body:{ rows: importRows, mapping } });
    document.getElementById('importResult').innerHTML = `<p class="helptext">
      Imported ${summary.policiesCreated} case${summary.policiesCreated===1?'':'s'}
      (${summary.clientsCreated} new client${summary.clientsCreated===1?'':'s'}, ${summary.clientsMatched} matched),
      ${summary.commissionEntries} commission entries, ${summary.remindersScheduled} payment reminders scheduled.
      ${summary.skipped.length ? `${summary.skipped.length} row(s) skipped.` : ''}</p>`;
    say(`Imported ${summary.policiesCreated} cases!`);
    renderBook('', '');
  };
  document.getElementById('cancelImport').onclick = () => { area.innerHTML = ''; };
}

/* ================= PROFIT ================= */
const COMM_TYPE_MAP = { Initial:'advance', Renewal:'additional', Override:'override', Chargeback:'chargeback' };
let trendMonths = 6;
async function monthlyStatsReal(count){
  const [activity, expenses, commissions] = await Promise.all([
    apiFetch('/api/activity'), apiFetch('/api/expenses'), apiFetch('/api/commission-entries'),
  ]);
  const months = [];
  const now = new Date();
  for (let i = count-1; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    months.push({ key: `${d.getFullYear()}-${d.getMonth()}`, label: d.toLocaleString(undefined,{month:'short', year: count>12?'2-digit':undefined}) });
  }
  const monthKey = (dateStr) => { const d = new Date(dateStr); return `${d.getFullYear()}-${d.getMonth()}`; };
  return months.map(m => {
    const rows = activity.filter(a => monthKey(a.date) === m.key);
    const dials = rows.reduce((s,a)=>s+a.dials,0);
    const sales = rows.reduce((s,a)=>s+a.sales,0);
    const monthCommissions = commissions.filter(c => monthKey(c.entryDate) === m.key);
    const gross = monthCommissions.filter(c=>['advance','additional','other'].includes(c.entryType)).reduce((s,c)=>s+Number(c.amount),0);
    const cb = Math.abs(monthCommissions.filter(c=>c.entryType==='chargeback').reduce((s,c)=>s+Number(c.amount),0));
    const cost = expenses.filter(e => monthKey(e.expenseDate) === m.key).reduce((s,e)=>s+Number(e.amount),0);
    return { label: m.label, dials, sales, gross, cb, cost, net: gross - cb - cost };
  });
}
async function renderProfit(){

  const [dash, dashAllTime, entries, policies, activityRange] = await Promise.all([
    apiFetch(`/api/dashboard?from=${range.from}&to=${range.to}`),
    apiFetch('/api/dashboard'),
    apiFetch(`/api/commission-entries?from=${range.from}&to=${range.to}`),
    apiFetch('/api/policies'),
    apiFetch(`/api/activity?from=${range.from}&to=${range.to}`),
  ]);
  policiesCache = policies;
  const isAgency = dash.tier === 'agency_owner';

  const actTotals = activityRange.reduce((s,r)=>({dials:s.dials+r.dials, appointments:s.appointments+r.appointments, sales:s.sales+r.sales}), {dials:0,appointments:0,sales:0});
  const placedRange = policies.filter(p => (p.status==='active'||p.status==='lapsed') && p.issueDate.slice(0,10) >= range.from && p.issueDate.slice(0,10) <= range.to);
  const costPerSale = actTotals.sales ? dash.totalExpenses/actTotals.sales : 0;
  const commissionPerDial = actTotals.dials ? dash.grossCommission/actTotals.dials : 0;
  const costPerAppointment = actTotals.appointments ? dash.totalExpenses/actTotals.appointments : 0;
  const costPerDial = actTotals.dials ? dash.totalExpenses/actTotals.dials : 0;
  const avgCaseFYC = placedRange.length ? dash.grossCommission/placedRange.length : 0;
  const avgAnnualPremium = placedRange.length ? placedRange.reduce((s,p)=>s+Number(p.monthlyPremium)*12,0)/placedRange.length : 0;

  const profitMargin = dashAllTime.grossCommission ? (dashAllTime.netProfit/dashAllTime.grossCommission*100) : 0;
  const chargebackRatio = dashAllTime.grossCommission ? (dashAllTime.chargebacks/dashAllTime.grossCommission*100) : 0;
  const oneYearAgo = new Date(); oneYearAgo.setDate(oneYearAgo.getDate()-365);
  const oneYearAgoISO = toISO(oneYearAgo);
  const matured = policies.filter(p => (p.status==='active'||p.status==='lapsed') && p.issueDate.slice(0,10) <= oneYearAgoISO);
  const persistency = matured.length ? Math.round(matured.filter(p=>p.status==='active').length/matured.length*100) : 100;

  const stats = await monthlyStatsReal(trendMonths);

  mainInner.innerHTML = `
    <div class="page-header"><div><div class="page-eyebrow">Profit</div><h1>Financial reporting</h1></div></div>
    ${dateFilterHTML('profit')}

    <div class="panel">
      <h2>Statement</h2>
      <p class="helptext" style="margin:-8px 0 14px;">${fmtDate(range.from)} – ${fmtDate(range.to)}</p>
      <table class="statement-table">
        <tbody>
          <tr><td>Gross First-Year Commission</td><td>${fmt(dash.grossCommission)}</td></tr>
          <tr><td>Chargebacks</td><td class="neg">−${fmt(dash.chargebacks)}</td></tr>
          <tr class="statement-total"><td>Net Commission</td><td>${fmt(dash.grossCommission - dash.chargebacks)}</td></tr>
          <tr><td>Operating Costs</td><td class="neg">−${fmt(dash.totalExpenses)}</td></tr>
          <tr class="statement-total"><td>Net Profit</td><td class="${dash.netProfit>=0?'pos':'neg'}">${fmt(dash.netProfit)}</td></tr>
          <tr><td>Pending (not yet paid)</td><td style="color:var(--gold);">${fmt(dash.pendingPremium)}</td></tr>
        </tbody>
      </table>
    </div>

    <div class="panel">
      <div class="trend-controls">
        <h2 style="margin:0;">Net by month</h2>
        <select id="trendRangeSelect" style="max-width:160px;">
          <option value="3" ${trendMonths===3?'selected':''}>Last 3 months</option>
          <option value="6" ${trendMonths===6?'selected':''}>Last 6 months</option>
          <option value="12" ${trendMonths===12?'selected':''}>Last 12 months</option>
          <option value="ytd" ${trendMonths==='ytd'?'selected':''}>Year to date</option>
        </select>
      </div>
      <div class="chart-box"><canvas id="netChart"></canvas></div>
    </div>

    <div class="panel">
      <h2>Unit economics</h2>
      <p class="helptext" style="margin:-8px 0 14px;">${fmtDate(range.from)} – ${fmtDate(range.to)}</p>
      <div class="metrics-grid">
        <div class="metric-cell"><div class="mlabel">Cost per Sale</div><div class="mvalue">${fmt(costPerSale)}</div></div>
        <div class="metric-cell"><div class="mlabel">Commission per Dial</div><div class="mvalue">${fmtMoney2(commissionPerDial)}</div></div>
        <div class="metric-cell"><div class="mlabel">Cost per Appointment</div><div class="mvalue">${fmt(costPerAppointment)}</div></div>
        <div class="metric-cell"><div class="mlabel">Cost per Dial</div><div class="mvalue">${fmtMoney2(costPerDial)}</div></div>
        <div class="metric-cell"><div class="mlabel">Average Case FYC</div><div class="mvalue">${fmt(avgCaseFYC)}</div></div>
        <div class="metric-cell"><div class="mlabel">Average Annual Premium</div><div class="mvalue">${fmt(avgAnnualPremium)}</div></div>
      </div>
    </div>

    <div class="panel">
      <h2>Health of the book</h2>
      <p class="helptext" style="margin:-8px 0 14px;">Whole book, all time — not affected by the date filter above</p>
      <table class="statement-table">
        <tbody>
          <tr><td>Profit margin on gross FYC</td><td>${profitMargin.toFixed(1)}%</td></tr>
          <tr><td>Chargeback ratio</td><td class="${chargebackRatio>10?'neg':''}">${chargebackRatio.toFixed(1)}%</td></tr>
          <tr><td>Persistency (12+ months on the books)</td><td class="pos">${persistency}%</td></tr>
        </tbody>
      </table>
    </div>

    <div class="panel">
      <h2>Month over month</h2>
      <table><thead><tr><th>Month</th><th>Dials</th><th>Sales</th><th>Gross Commission</th><th>Chargebacks</th><th>Costs</th><th>Net Profit</th></tr></thead>
      <tbody>${stats.slice().reverse().map(m=>`<tr><td>${m.label}</td><td>${m.dials}</td><td>${m.sales}</td><td>${fmt(m.gross)}</td><td class="neg">−${fmt(m.cb)}</td><td>${fmt(m.cost)}</td><td class="${m.net>=0?'pos':'neg'}">${fmt(m.net)}</td></tr>`).join('')}</tbody></table>
    </div>

    <div class="panel">
      <h2>Log Commission</h2>
      <form class="entry" id="commForm">
        <div class="full"><label>Case</label><select required name="policyId" id="commPolicySelect">${policies.map(p=>`<option value="${p.id}">${(p.client?.name||'—')} — ${p.carrier} — ${p.productType}</option>`).join('') || '<option value="">No cases yet</option>'}</select></div>
        <div><label>Type</label><select name="type"><option value="Initial">Initial</option><option value="Renewal">Renewal</option>${isAgency?'<option value="Override">Override</option>':''}<option value="Chargeback">Chargeback</option></select></div>
        <div><label>Amount ($)</label><input required type="number" step="0.01" name="amount" placeholder="850"></div>
        <div><label>Date</label><input required type="date" name="date"></div>
        <div class="full"><button class="primary" type="submit">Log Commission</button></div>
        <div class="full errortext" id="commError"></div>
      </form>
    </div>

    <div class="panel">
      <h2>Commission History</h2>
      <table><thead><tr><th>Client</th><th>Type</th><th>Amount</th><th>Date</th></tr></thead>
      <tbody>${[...entries].sort((a,b)=>new Date(b.entryDate)-new Date(a.entryDate)).map(c=>`<tr><td>${c.policy?.client?.name || (c.ownerType==='agency' ? 'Agency override' : '—')}</td><td>${c.entryType}</td><td>${fmt(c.amount)}</td><td>${fmtDate(c.entryDate)}</td></tr>`).join('') || '<tr><td colspan="4" class="helptext">No commissions in this range.</td></tr>'}</tbody></table>
    </div>
  `;
  wireDateFilter('profit', renderProfit);
  document.getElementById('trendRangeSelect').onchange = (e) => {
    const v = e.target.value;
    trendMonths = v === 'ytd' ? (new Date().getMonth()+1) : Number(v);
    renderProfit();
  };
  renderNetChart({ labels: stats.map(m=>m.label), data: stats.map(m=>m.net) });

  document.getElementById('commForm').addEventListener('submit', async e => {
    e.preventDefault();
    const errEl = document.getElementById('commError');
    errEl.textContent = '';
    const f = new FormData(e.target);
    const entryType = COMM_TYPE_MAP[f.get('type')];
    const ownerType = entryType === 'override' ? 'agency' : 'producer';
    try {
      await apiFetch('/api/commission-entries', { method:'POST', body:{
        policyId: f.get('policyId'), ownerType, entryType,
        amount: Number(f.get('amount')), entryDate: f.get('date'),
        agencyId: ownerType === 'agency' ? me.agencyId : undefined,
      }});
      say('Commission logged!');
      renderProfit();
    } catch (err) { errEl.textContent = err.message; }
  });
}
