<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BOB — Sign In</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#A63D40">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BOB">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="stylesheet" href="/css/bob.css">
</head>
<body>
<div class="auth-wrap" style="flex-direction:column; gap:14px;">
  <div style="width:100%; max-width:420px;">
    <a class="ghost" href="/" style="font-size:.85rem; padding:8px 14px;">← Back home</a>
  </div>
  <div class="auth-card">
    <div class="brand" style="margin-bottom:20px;">
      <div id="navMascot" style="width:34px; height:45px;"></div>
      <div><h1 style="font-size:1.3rem; margin:0;">Bob's got you covered</h1></div>
    </div>

    <div id="authTabs" class="auth-tabs">
      <button class="auth-tab active" data-mode="signin">Sign In</button>
      <button class="auth-tab" data-mode="signup">Sign Up</button>
    </div>

    <!-- SIGN IN -->
    <form class="auth-form" id="signinForm">
      <div><label>Email</label><input required type="email" name="email" placeholder="you@example.com"></div>
      <div><label>Password</label><input required type="password" name="password" placeholder="••••••••"></div>
      <button class="primary" type="submit">Sign In</button>
      <div class="errortext" id="signinError"></div>
    </form>

    <!-- SIGN UP -->
    <form class="auth-form section-hidden" id="signupForm">
      <div><label>Your Name</label><input required name="name" placeholder="Jordan Alvarez"></div>
      <div><label>Email</label><input required type="email" name="email" placeholder="you@example.com"></div>
      <div><label>Password</label><input required type="password" name="password" placeholder="At least 6 characters" minlength="6"></div>
      <div>
        <label>Plan</label>
        <div class="tier-options">
          <div class="tier-option selected" data-tier="individual">Producer</div>
          <div class="tier-option" data-tier="agency_owner">Agency Owner</div>
        </div>
      </div>
      <div id="agencyNameField" class="section-hidden">
        <label>Agency Name</label><input name="agencyName" placeholder="e.g. Alvarez Insurance Group">
      </div>
      <button class="primary" type="submit">Create Account</button>
      <div class="errortext" id="signupError"></div>
      <div class="helptext" id="signupNotice"></div>
    </form>

    <!-- COMPLETE PROFILE (already authenticated, e.g. after email confirmation) -->
    <form class="auth-form section-hidden" id="completeForm">
      <p class="helptext">Just a couple more details to finish setting up your account.</p>
      <div><label>Your Name</label><input required name="name" placeholder="Jordan Alvarez"></div>
      <div>
        <label>Plan</label>
        <div class="tier-options">
          <div class="tier-option selected" data-tier="individual">Producer</div>
          <div class="tier-option" data-tier="agency_owner">Agency Owner</div>
        </div>
      </div>
      <div id="completeAgencyNameField" class="section-hidden">
        <label>Agency Name</label><input name="agencyName" placeholder="e.g. Alvarez Insurance Group">
      </div>
      <button class="primary" type="submit">Finish Setup</button>
      <div class="errortext" id="completeError"></div>
    </form>

  </div>
</div>

<script src="/js/supabaseClient.js"></script>
<script src="/js/api.js"></script>
<script src="/js/mascot.js"></script>
<script src="/js/registerSW.js"></script>
<script>
wireMascot('navMascot', ["Hi, I'm Bob!", "Let's get your book set up.", "One book per account."]);
/* ---- tab switching ---- */
const signinForm = document.getElementById('signinForm');
const signupForm = document.getElementById('signupForm');
const completeForm = document.getElementById('completeForm');
document.querySelectorAll('#authTabs .auth-tab').forEach(t => {
  t.onclick = () => {
    document.querySelectorAll('#authTabs .auth-tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    signinForm.classList.toggle('section-hidden', t.dataset.mode !== 'signin');
    signupForm.classList.toggle('section-hidden', t.dataset.mode !== 'signup');
  };
});

/* ---- tier picker (shared behavior for signup + complete-profile forms) ---- */
function wireTierPicker(formEl, agencyFieldEl) {
  formEl.querySelectorAll('.tier-option').forEach(opt => {
    opt.onclick = () => {
      formEl.querySelectorAll('.tier-option').forEach(o => o.classList.remove('selected'));
      opt.classList.add('selected');
      agencyFieldEl.classList.toggle('section-hidden', opt.dataset.tier !== 'agency_owner');
    };
  });
}
wireTierPicker(signupForm, document.getElementById('agencyNameField'));
wireTierPicker(completeForm, document.getElementById('completeAgencyNameField'));

/* ---- arriving from a pricing link (e.g. /login.html?tier=agency_owner) ---- */
const requestedTier = new URLSearchParams(window.location.search).get('tier');
if (requestedTier === 'individual' || requestedTier === 'agency_owner') {
  document.querySelector('.auth-tab[data-mode="signup"]').click();
  const option = signupForm.querySelector(`.tier-option[data-tier="${requestedTier}"]`);
  if (option) option.click();
}
function selectedTier(formEl) {
  return formEl.querySelector('.tier-option.selected').dataset.tier;
}

/* ---- after any successful auth, figure out where to send the user ---- */
function safeRedirectTarget() {
  const target = new URLSearchParams(window.location.search).get('redirect');
  return target && target.startsWith('/') && !target.startsWith('//') ? target : null;
}
async function completeLoginFlow(email) {
  let me;
  try {
    me = await apiFetch('/api/me');
  } catch (err) {
    return; // apiFetch already redirects to /login.html on auth failure
  }
  const redirectTarget = safeRedirectTarget();
  if (redirectTarget) {
    window.location.href = redirectTarget;
    return;
  }
  if (me.producer) {
    window.location.href = '/app.html';
    return;
  }
  const pending = JSON.parse(localStorage.getItem('bob_pending_signup') || 'null');
  if (pending && pending.email === email) {
    await apiFetch('/api/auth/bootstrap', { method: 'POST', body: pending });
    localStorage.removeItem('bob_pending_signup');
    window.location.href = '/app.html';
    return;
  }
  // No pending signup info (e.g. they confirmed their email in a different browser) —
  // ask for the missing details before creating their Producer profile.
  signinForm.classList.add('section-hidden');
  signupForm.classList.add('section-hidden');
  document.getElementById('authTabs').classList.add('section-hidden');
  completeForm.classList.remove('section-hidden');
  completeForm.dataset.email = email;
}

/* ---- sign in ---- */
signinForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = new FormData(e.target);
  const errEl = document.getElementById('signinError');
  errEl.textContent = '';
  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email: f.get('email'), password: f.get('password'),
  });
  if (error) { errEl.textContent = error.message; return; }
  completeLoginFlow(data.user.email);
});

/* ---- sign up ---- */
signupForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = new FormData(e.target);
  const errEl = document.getElementById('signupError');
  const noticeEl = document.getElementById('signupNotice');
  errEl.textContent = ''; noticeEl.textContent = '';

  const email = f.get('email');
  const pending = {
    name: f.get('name'),
    tier: selectedTier(signupForm),
    agencyName: f.get('agencyName') || null,
    email,
  };

  const { data, error } = await supabaseClient.auth.signUp({ email, password: f.get('password') });
  if (error) { errEl.textContent = error.message; return; }

  localStorage.setItem('bob_pending_signup', JSON.stringify(pending));

  if (data.session) {
    // Email confirmation is off for this project — we're already logged in.
    completeLoginFlow(email);
  } else {
    noticeEl.textContent = 'Check your email to confirm your account, then sign in here.';
  }
});

/* ---- complete profile (post email-confirmation, no pending signup found) ---- */
completeForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = new FormData(e.target);
  const errEl = document.getElementById('completeError');
  errEl.textContent = '';
  try {
    await apiFetch('/api/auth/bootstrap', {
      method: 'POST',
      body: {
        name: f.get('name'),
        tier: selectedTier(completeForm),
        agencyName: f.get('agencyName') || null,
      },
    });
    window.location.href = '/app.html';
  } catch (err) {
    errEl.textContent = err.message;
  }
});

/* ---- if already signed in, skip straight to the right place ---- */
(async () => {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) completeLoginFlow(session.user.email);
})();
</script>
</body>
</html>
