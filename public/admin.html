<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BOB — Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<link rel="stylesheet" href="/css/bob.css">
</head>
<body>
<div class="wrap">
  <div class="page-header">
    <div><div class="page-eyebrow">Admin</div><h1>BOB console</h1></div>
    <div style="display:flex; gap:10px;">
      <a class="ghost" href="/app.html">Back to app</a>
      <button class="ghost" id="logoutBtn" type="button">Log out</button>
    </div>
  </div>

  <div id="statusMsg" class="helptext" style="margin-bottom:14px;"></div>

  <div id="adminBody" style="display:none;">
    <div class="auth-tabs" id="adminTabs" style="flex-wrap:wrap;">
      <button class="auth-tab active" type="button" data-tab="overview">Overview</button>
      <button class="auth-tab" type="button" data-tab="customers">Customers</button>
      <button class="auth-tab" type="button" data-tab="billing">Billing</button>
      <button class="auth-tab" type="button" data-tab="imos">IMOs</button>
      <button class="auth-tab" type="button" data-tab="rates">Rates</button>
      <button class="auth-tab" type="button" data-tab="announcements">Announcements</button>
      <button class="auth-tab" type="button" data-tab="flags">Flags</button>
      <button class="auth-tab" type="button" data-tab="suggestions">Suggestions</button>
      <button class="auth-tab" type="button" data-tab="audit">Audit log</button>
    </div>
    <div id="tabBody"></div>
  </div>
</div>

<script src="/js/supabaseClient.js"></script>
<script src="/js/api.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
