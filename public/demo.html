/* ============================================================
   date helpers
   ============================================================ */
function toISO(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function todayISO(){ return toISO(new Date()); }
function addDays(iso, n){ const d = new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return toISO(d); }
function daysAgoISO(n){ const d = new Date(); d.setDate(d.getDate()-n); return toISO(d); }
function monthsAgoISO(n, day){ const d = new Date(); d.setDate(1); d.setMonth(d.getMonth()-n); if (day) d.setDate(Math.min(day,28)); return toISO(d); }
function fmt(n){ return '$'+Number(n||0).toLocaleString(undefined,{maximumFractionDigits:0}); }
function fmtMoney2(n){ return '$'+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2}); }
function fmtDate(iso){ if(!iso) return '—'; return new Date(iso+'T00:00:00').toLocaleDateString(undefined,{month:'short', day:'numeric', year:'numeric'}); }
function fmtDateShort(iso){ if(!iso) return '—'; return new Date(iso+'T00:00:00').toLocaleDateString(undefined,{month:'short', day:'numeric'}); }
// Only for a FROM–TO range label — see the matching note in app.html.
function fmtDateRangeLabel(iso){ if(!iso) return '—'; return new Date(iso+'T00:00:00').toLocaleDateString(undefined,{month:'short', day:'numeric', year:'numeric'}); }
function pct(a,b){ return b ? ((a/b)*100).toFixed(1)+'%' : '0%'; }
function uid(prefix){ return prefix+'_'+Math.random().toString(36).slice(2,9); }

/* ============================================================
   persisted store (clients, daily activity, cost lines) — all
   local to this browser, seeded once with ~14 months of sample
   history so every report/filter has something real to show.
   ============================================================ */
const STORE_KEY = 'bob_demo_store_v8';
const COST_CATEGORIES = [
  { key:'Leads',      color:'#7A3B4A' },
  { key:'Marketing',      color:'#A63D40' },
  { key:'E&O insurance',  color:'#D8CBB8' },
  { key:'Licenses',       color:'#9A8F7C' },
  { key:'CRM/Tools',      color:'#7C9473' },
  { key:'Office',         color:'#D4A373' },
  { key:'Travel',         color:'#C9986B' },
  { key:'Staff',          color:'#5F7A6E' },
  { key:'Insurance',      color:'#8C5B63' },
  { key:'Other',          color:'#B7ADA0' },
];
function costColor(cat){ return (COST_CATEGORIES.find(c=>c.key===cat) || {}).color || '#B7ADA0'; }

function seedStore(){
  const CARRIERS = ['Americo','Mutual of Omaha','National Life','Transamerica','F&G','Foresters','Corebridge'];
  const PRODUCTS = ['Instant IUL','Living Promise','Flexlife IUL','FE Express','Pathsetter IUL','Term 20','Whole Life'];
  const NAMES = ['Maria Delgado','James Whitaker','Elena Ruiz','Robert Chen','Danielle Brooks','Carlos Mendoza','Ashley Cooper','Michael Torres','Sarah Kim','David Nguyen','Patricia Owens','Kevin Walsh','Nicole Foster','Brian Alvarez'];
  const LEAD_VENDORS = ['Facebook Leads','Google Ads','Referral','Direct Mail','Aged Leads Co'];
  const LEAD_TYPES = ['Final Expense','Mortgage Protection','IUL','Annuity Lead'];
  const MONTHLIES = [62.10,94.50,120.00,150.00,187.40,210.00,240.00,312.00,275.00,98.00,155.00,205.00,132.00,178.50];
  const STATUS_PLAN = ['active','active','pending','lapsed','active','active','pending','active','active','active','lapsed','active','pending','active'];

  const clients = NAMES.map((name, i) => {
    const monthsBack = 13 - Math.floor(i * 13 / (NAMES.length - 1)); // spreads ~0..13 months back, oldest first
    let dayOfMonth = 3 + (i*7)%24;
    if (monthsBack === 0) dayOfMonth = Math.min(dayOfMonth, new Date().getDate() - 1); // never seed a future date
    const submitted = monthsAgoISO(monthsBack, dayOfMonth);
    const status = STATUS_PLAN[i];
    const monthlyPremium = MONTHLIES[i];
    const isPlaced = status === 'active' || status === 'lapsed';
    const approvedDate = isPlaced ? addDays(submitted, 5) : null;
    const issueDate = isPlaced ? addDays(submitted, 9) : null;
    const issuePaidFYC = isPlaced ? Math.round(monthlyPremium * 12 * 0.75) : 0;
    const chargebackAmount = status === 'lapsed' ? issuePaidFYC : 0;
    const chargebackDate = status === 'lapsed' ? addDays(issueDate, 60) : null;
    // issuePaidFYC is a DERIVED total (see recalcIssuePaidFYC) — this one seeded "Initial"
    // entry is what it derives from, so the Commission entries panel has real history.
    const commissionEntries = isPlaced ? [{ id: uid('ce'), type: 'Initial', amount: issuePaidFYC, date: issueDate }] : [];
    return {
      id: uid('c'), name,
      email: name.toLowerCase().replace(/[^a-z]+/g,'.') + '@example.com',
      phone: `(${200+i*11}) 555-0${100+i*7}`,
      carrier: CARRIERS[i % CARRIERS.length],
      product: PRODUCTS[i % PRODUCTS.length],
      policyNumber: status === 'pending' ? null : `${CARRIERS[i % CARRIERS.length].slice(0,2).toUpperCase()}-${10000+i*137}`,
      faceAmount: Math.round(monthlyPremium * 12 * 18),
      saleType: 'life', singlePremium: null,
      monthlyPremium, status,
      leadVendor: LEAD_VENDORS[i % LEAD_VENDORS.length],
      leadType: LEAD_TYPES[i % LEAD_TYPES.length],
      dateSubmitted: submitted, approvedDate, issueDate, issuePaidFYC, commissionEntries,
      chargebackAmount, chargebackDate,
      notes: '',
    };
  });

  // ~11 months of weekday activity, with occasional zero/skip days for realism
  const activity = [];
  for (let d = 335; d >= 0; d--) {
    const iso = daysAgoISO(d);
    const dow = new Date(iso+'T00:00:00').getDay();
    if (dow === 0 || dow === 6) continue; // skip weekends
    if (Math.random() < 0.08) continue; // the occasional day off
    const dials = 55 + Math.floor(Math.random()*55);
    const contacts = Math.round(dials * (0.38 + Math.random()*0.12));
    const appointments = Math.round(contacts * (0.10 + Math.random()*0.05));
    const presentations = Math.round(appointments * (0.55 + Math.random()*0.3));
    const sales = Math.round(presentations * (0.15 + Math.random()*0.25));
    activity.push({ date: iso, dials, contacts, appointments, presentations, sales });
  }

  // cost lines spread over the last ~11 months across every category
  const costs = [];
  for (let m = 10; m >= 0; m--) {
    COST_CATEGORIES.forEach((cat, ci) => {
      if (cat.key === 'CRM/Tools') return; // CRM/Tools is the recurring example added below instead
      if (Math.random() < 0.12) return; // not every category every month
      const base = { 'Leads':320,'Marketing':110,'E&O insurance':45,'Licenses':35,'CRM/Tools':85,'Office':55,'Travel':65,'Staff':60,'Insurance':50,'Other':30 }[cat.key] || 40;
      const amount = Math.round(base * (0.7 + Math.random()*0.7));
      // Leads costs rotate through the same vendors clients are attributed to, so the
      // Analytics tab's Lead Vendor Performance panel has real spend-vs-conversion data.
      const vendor = cat.key === 'Leads' ? LEAD_VENDORS[(m + ci) % LEAD_VENDORS.length] : null;
      costs.push({ id: uid('e'), date: monthsAgoISO(m, 5 + ci*2), amount, category: cat.key, vendor, description: '', isRecurring: false, recurringEndDate: null });
    });
  }
  // One recurring example so the "recurring vs one-time" feature is visible out of the box.
  costs.push({ id: uid('e'), date: monthsAgoISO(10, 3), amount: 79, category: 'CRM/Tools', description: 'CRM subscription', isRecurring: true, recurringFrequency: 'monthly', recurringEndDate: null });

  const goals = { dialsTarget: 4000, appointmentsTarget: 160, sitsTarget: 120, salesTarget: 20, fycTarget: 15000 };

  return { clients, activity, costs, goals, suggestions: [], calcContractLevel: 100 };
}
function loadStore(){
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e){}
  const fresh = seedStore();
  try { localStorage.setItem(STORE_KEY, JSON.stringify(fresh)); } catch(e){}
  return fresh;
}
function saveStore(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch(e){} }
let store = loadStore();

function annualPremium(c){ return c.saleType === 'annuity' ? Number(c.singlePremium||0) : c.monthlyPremium * 12; }
const STATUS_TAG = {
  pending: { cls: 'pending', label: 'Pending' },
  approved_not_paid: { cls: 'approved', label: 'Approved not paid' },
  active: { cls: 'active-pol', label: 'Issue paid' },
  declined: { cls: 'lapsed', label: 'Declined' },
  withdrawn: { cls: 'lapsed', label: 'Withdrew' },
  cancelled: { cls: 'lapsed', label: 'Cancelled' },
  lapsed: { cls: 'lapsed', label: 'Lapsed' },
};
// issuePaidFYC is kept as a plain field (every report already reads it directly) but is
// derived from the commission entries ledger — call this after any add/edit/delete so it
// never drifts from the entries actually logged.
function recalcIssuePaidFYC(c){ c.issuePaidFYC = (c.commissionEntries||[]).reduce((s,e)=>s+Number(e.amount),0); }
function activityInRange(from,to){ return store.activity.filter(a => a.date >= from && a.date <= to); }
// A recurring cost is a TEMPLATE (isRecurring:true), expanded here into one virtual
// instance per calendar month it applies to — mirrors the real app's src/lib/recurring.js
// so the demo behaves exactly like production: set it once, it shows up every month
// after, until stopped or deleted, with no re-entry.
function lastDayOfMonth(year, monthIndex){ return new Date(year, monthIndex+1, 0).getDate(); }
function expandMonthlyCost(template, anchor, rangeStart, seriesEnd){
  const anchorDay = anchor.getDate();
  let cursor = new Date(anchor.getFullYear(), anchor.getMonth(), 1);
  const windowStart = new Date(rangeStart.getFullYear(), rangeStart.getMonth(), 1);
  if (cursor < windowStart) cursor = windowStart;
  const windowEnd = new Date(seriesEnd.getFullYear(), seriesEnd.getMonth(), 1);

  const instances = [];
  while (cursor <= windowEnd) {
    const year = cursor.getFullYear(), monthIndex = cursor.getMonth();
    const day = Math.min(anchorDay, lastDayOfMonth(year, monthIndex));
    const monthKey = `${year}-${String(monthIndex+1).padStart(2,'0')}`;
    instances.push({ ...template, id: `${template.id}::${monthKey}`, date: toISO(new Date(year, monthIndex, day)) });
    cursor = new Date(year, monthIndex+1, 1);
  }
  return instances;
}
// Steps forward in real 7-day increments from the anchor date — a weekly template
// contributes its full amount on EVERY occurrence, so a calendar month picks up 4 or 5
// charges depending on how many weekly dates land inside it, mirroring a real bill hitting
// a bank statement rather than an averaged/prorated monthly figure.
function expandWeeklyCost(template, anchor, rangeStart, seriesEnd){
  const WEEK_MS = 7*24*60*60*1000;
  let cursor = anchor.getTime();
  const rangeStartMs = rangeStart.getTime();
  const seriesEndMs = seriesEnd.getTime();
  if (cursor < rangeStartMs) {
    cursor += Math.floor((rangeStartMs - cursor) / WEEK_MS) * WEEK_MS;
    while (cursor < rangeStartMs) cursor += WEEK_MS;
  }
  const instances = [];
  while (cursor <= seriesEndMs) {
    const d = new Date(cursor);
    const dateKey = toISO(d);
    instances.push({ ...template, id: `${template.id}::${dateKey}`, date: dateKey });
    cursor += WEEK_MS;
  }
  return instances;
}
function expandRecurringCost(template, from, to){
  const anchor = new Date(template.date+'T00:00:00');
  const today = new Date();
  const rangeStart = from ? new Date(from+'T00:00:00') : anchor;
  const rangeEnd = to ? new Date(to+'T00:00:00') : today;
  const seriesEnd = (template.recurringEndDate && new Date(template.recurringEndDate+'T00:00:00') < rangeEnd)
    ? new Date(template.recurringEndDate+'T00:00:00') : rangeEnd;
  return template.recurringFrequency === 'weekly'
    ? expandWeeklyCost(template, anchor, rangeStart, seriesEnd)
    : expandMonthlyCost(template, anchor, rangeStart, seriesEnd);
}
function parseCostId(id){ const [realId, monthKey] = id.split('::'); return { realId, monthKey: monthKey||null }; }
function costsInRange(from,to){
  const oneTime = store.costs.filter(c => !c.isRecurring && c.date >= from && c.date <= to);
  const recurring = store.costs.filter(c => c.isRecurring).flatMap(t => expandRecurringCost(t, from, to));
  return [...oneTime, ...recurring];
}
function sumActivity(rows){ return rows.reduce((s,r)=>({dials:s.dials+r.dials, contacts:s.contacts+(r.contacts||0), appointments:s.appointments+r.appointments, presentations:s.presentations+r.presentations, sales:s.sales+r.sales}), {dials:0,contacts:0,appointments:0,presentations:0,sales:0}); }
function grossFYCInRange(from,to){ return store.clients.filter(c => (c.status==='active'||c.status==='lapsed') && c.issueDate>=from && c.issueDate<=to).reduce((s,c)=>s+c.issuePaidFYC,0); }
function placedInRange(from,to){ return store.clients.filter(c => (c.status==='active'||c.status==='lapsed') && c.issueDate>=from && c.issueDate<=to); }
function chargebacksInRange(from,to){ return store.clients.filter(c => c.chargebackDate && c.chargebackDate>=from && c.chargebackDate<=to).reduce((s,c)=>s+c.chargebackAmount,0); }
function costsTotalInRange(from,to){ return costsInRange(from,to).reduce((s,c)=>s+c.amount,0); }
function pendingAsOf(to){ return store.clients.filter(c => c.status==='pending' && c.dateSubmitted<=to).reduce((s,c)=>s+annualPremium(c),0); }
function statement(from,to){
  const gross = grossFYCInRange(from,to);
  const cb = chargebacksInRange(from,to);
  const netCommission = gross - cb;
  const costsTotal = costsTotalInRange(from,to);
  const netProfit = netCommission - costsTotal;
  const pending = pendingAsOf(to);
  return { gross, cb, netCommission, costsTotal, netProfit, pending };
}

/* ============================================================
   shared date-range report filter (Desk, Activity, Book, Costs, Profit)
   ============================================================ */
const DATE_RANGE_PRESETS = [
  ['today','Today'], ['yesterday','Yesterday'], ['this_week','This week'], ['this_month','This month'],
  ['last_month','Last month'], ['this_quarter','This quarter'], ['ytd','Year to date'], ['all_time','All time'], ['custom','Custom'],
];
const dateFilterState = {
  desk: { key: 'this_month', from: '', to: '' },
  activity: { key: 'this_month', from: '', to: '' },
  book: { key: 'ytd', from: '', to: '' },
  costs: { key: 'this_month', from: '', to: '' },
  profit: { key: 'this_month', from: '', to: '' },
  analytics: { key: 'this_month', from: '', to: '' },
};
function computeDateRange(key, customFrom, customTo){
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth(), d = now.getDate();
  switch (key) {
    case 'today': { const t = toISO(now); return { from: t, to: t }; }
    case 'yesterday': { const t = toISO(new Date(y,m,d-1)); return { from: t, to: t }; }
    case 'this_week': { const start = new Date(y,m,d - now.getDay()); return { from: toISO(start), to: toISO(now) }; }
    case 'last_month': return { from: toISO(new Date(y,m-1,1)), to: toISO(new Date(y,m,0)) };
    case 'this_quarter': { const q = Math.floor(m/3); return { from: toISO(new Date(y,q*3,1)), to: toISO(now) }; }
    case 'ytd': return { from: toISO(new Date(y,0,1)), to: toISO(now) };
    case 'all_time': return { from: '2000-01-01', to: toISO(now) };
    case 'custom': return { from: customFrom || toISO(new Date(y,m,1)), to: customTo || toISO(now) };
    case 'this_month': default: return { from: toISO(new Date(y,m,1)), to: toISO(now) };
  }
}
function dateFilterHTML(pageKey){
  const state = dateFilterState[pageKey];
  const range = computeDateRange(state.key, state.from, state.to);
  return `
  <div class="date-filter" data-page="${pageKey}">
    <select class="date-filter-select">
      ${DATE_RANGE_PRESETS.map(([k,label]) => `<option value="${k}" ${state.key===k?'selected':''}>${label}</option>`).join('')}
    </select>
    <span class="date-filter-custom${state.key==='custom' ? '' : ' section-hidden'}">
      <input type="date" class="date-filter-from" value="${range.from}">
      <span>to</span>
      <input type="date" class="date-filter-to" value="${range.to}">
      <button type="button" class="ghost date-filter-apply">Apply</button>
    </span>
    <span class="date-filter-range helptext">${fmtDateRangeLabel(range.from)} – ${fmtDateRangeLabel(range.to)}</span>
  </div>`;
}
function wireDateFilter(pageKey, onChange){
  const wrap = mainInner.querySelector(`.date-filter[data-page="${pageKey}"]`);
  if (!wrap) return;
  const state = dateFilterState[pageKey];
  const select = wrap.querySelector('.date-filter-select');
  const custom = wrap.querySelector('.date-filter-custom');
  select.onchange = () => {
    state.key = select.value;
    if (state.key === 'custom') { custom.classList.remove('section-hidden'); return; }
    onChange();
  };
  wrap.querySelector('.date-filter-apply').onclick = () => {
    state.from = wrap.querySelector('.date-filter-from').value;
    state.to = wrap.querySelector('.date-filter-to').value;
    onChange();
  };
}

/* ============================================================
   modal helper
   ============================================================ */
function openModal(innerHTML, opts){
  closeModal();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'activeModal';
  overlay.innerHTML = `<div class="modal-box${opts && opts.wide ? ' modal-wide' : ''}">${innerHTML}</div>`;
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
  document.body.appendChild(overlay);
  return overlay;
}
function closeModal(){ const m = document.getElementById('activeModal'); if (m) m.remove(); }

/* ---- today's tally lives alongside the rest of the store ---- */
function todayRow(){
  let row = store.activity.find(r => r.date === todayISO());
  if (!row) { row = { date: todayISO(), dials:0, contacts:0, appointments:0, presentations:0, sales:0 }; store.activity.push(row); }
  return row;
}
function bump(field, delta){
  const row = todayRow();
  row[field] = Math.max(0, row[field] + delta);
  saveStore();
  renderCurrentPage();
}

const mainInner = document.getElementById('mainInner');

/* ================= DESK ================= */
function renderDesk(){
  const range = computeDateRange(dateFilterState.desk.key, dateFilterState.desk.from, dateFilterState.desk.to);
  const st = statement(range.from, range.to);
  const funnel = sumActivity(activityInRange(range.from, range.to));
  const t = todayRow();
  const placedAll = store.clients.filter(c => c.status==='active'||c.status==='lapsed').length;

  const monthFrom = toISO(new Date(new Date().getFullYear(), new Date().getMonth(), 1));
  const monthTo = todayISO();
  const monthActivity = sumActivity(activityInRange(monthFrom, monthTo));
  const monthFYC = grossFYCInRange(monthFrom, monthTo);
  const GOALS = {
    dials:[monthActivity.dials, store.goals.dialsTarget], appointments:[monthActivity.appointments, store.goals.appointmentsTarget],
    sits:[monthActivity.presentations, store.goals.sitsTarget], sales:[monthActivity.sales, store.goals.salesTarget], fyc:[monthFYC, store.goals.fycTarget],
  };

  const recent = [...store.clients].sort((a,b)=>new Date(b.dateSubmitted)-new Date(a.dateSubmitted)).slice(0,5);
  const costLines = COST_CATEGORIES.map(c => ({ cat:c.key, color:c.color, total: costsInRange(range.from,range.to).filter(e=>e.category===c.key).reduce((s,e)=>s+e.amount,0) })).filter(c=>c.total>0);

  mainInner.innerHTML = `
    <div class="page-header"><div><div class="page-eyebrow">Desk</div><h1>Sample producer's book</h1></div>
    <button class="ghost" type="button" id="addClientBtn">+ Add a client</button></div>

    ${dateFilterHTML('desk')}

    <div class="grid" style="margin-bottom:18px;">
      <div class="card"><div class="stat-label">Net Profit</div><div class="stat-value ${st.netProfit>=0?'pos':'neg'}">${fmt(st.netProfit)}</div><div class="stat-sub">After chargebacks and costs</div></div>
      <div class="card"><div class="stat-label">Gross Commission</div><div class="stat-value">${fmt(st.gross)}</div><div class="stat-sub">${placedAll} placed · ${fmt(st.pending)} pending</div></div>
      <div class="card"><div class="stat-label">Chargebacks</div><div class="stat-value neg">−${fmt(st.cb)}</div><div class="stat-sub">${store.clients.filter(c=>c.status==='lapsed').length} lapsed</div></div>
      <div class="card"><div class="stat-label">Operating Costs</div><div class="stat-value">${fmt(st.costsTotal)}</div><div class="stat-sub">${fmt(st.costsTotal/(funnel.sales||1))} / sale</div></div>
    </div>

    <div class="panel">
      <h2>Today</h2>
      <div class="stepper-grid">
        ${['dials','contacts','appointments','presentations','sales'].map(f => `
          <div class="stepper-box">
            <button class="stepper-btn" onclick="bump('${f}',-1)">−</button>

function funnelRow(label, value, total, conv){
  return `<div class="funnel-row">
    <div class="row-top"><span>${label}</span><span>${value}${conv ? ` <span class="conv">· ${conv} conv</span>`:''}</span></div>
    <div class="bar-track"><div class="bar-fill" style="width:${total ? Math.min(100,(value/total*100)) : 0}%"></div></div>
  </div>`;
}
function goalCell(label, [have, target], isMoney){
  const pctVal = target ? Math.min(100, (have/target)*100) : 0;
  return `<div class="goal-cell">
    <div class="glabel">${label}</div>
    <div class="gvalue">${isMoney ? fmt(have) : have} / ${isMoney ? fmt(target) : target}</div>
    <div class="bar-track"><div class="bar-fill" style="width:${pctVal}%"></div></div>
  </div>`;
}
function caseRow(c){
  const tag = STATUS_TAG[c.status] || STATUS_TAG.pending;
  return `<div class="case-card">
    <div><button class="case-name-link" onclick="openClientDetail('${c.id}')">${c.name}</button><div class="case-sub">${c.product} · ${c.carrier} · ${fmtDateShort(c.dateSubmitted)}</div></div>
    <div class="case-right">
      <div class="case-amount">${fmt(annualPremium(c))}</div>
      <div style="margin-top:4px;"><span class="tag ${tag.cls}">${tag.label}</span>${c.chargebackAmount ? ` <span class="helptext" style="color:var(--red);">−${fmt(c.chargebackAmount)} CB</span>`:''}</div>
    </div>
  </div>`;
}
function donutBlock(costLines){
  return `<div class="donut-wrap">
    <div class="chart-box" style="width:180px; height:180px; flex-shrink:0;"><canvas id="donutCanvas"></canvas></div>
    <div class="donut-legend">
      ${costLines.map(c => `<div class="donut-legend-row"><span><span class="dot" style="background:${c.color}"></span>${c.cat}</span><span>${fmt(c.total)}</span></div>`).join('')}
    </div>
  </div>`;
}

let netChart, donutChart, activityChart;
function renderNetChart(data, labels){
  const ctx = document.getElementById('netChart');
  if (!ctx) return;
  if (netChart) netChart.destroy();
  netChart = new Chart(ctx, { type:'line', data:{ labels, datasets:[{
    data, borderColor:'#1B7A73', backgroundColor:'rgba(27,122,115,.15)',
    fill:true, tension:.45, cubicInterpolationMode:'monotone', pointRadius:0,
  }]}, options:{ responsive:true, maintainAspectRatio:false,
    plugins:{ legend:{ display:false } },
    scales:{ x:{ ticks:{ color:getComputedStyle(document.body).color } }, y:{ ticks:{ color:getComputedStyle(document.body).color } } } } });
}
function renderDonut(id, costLines){
  const ctx = document.getElementById(id);
  if (!ctx) return;
  if (donutChart) donutChart.destroy();
  donutChart = new Chart(ctx, { type:'doughnut', data:{
    labels: costLines.map(c=>c.cat), datasets:[{ data: costLines.map(c=>c.total), backgroundColor: costLines.map(c=>c.color) }]
  }, options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ display:false } }, cutout:'68%' } });
}

function monthBuckets(count){
  const months = [];
  const now = new Date();
  for (let i = count-1; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const start = toISO(d);
    const end = toISO(new Date(now.getFullYear(), now.getMonth()-i+1, 0));
    months.push({ label: d.toLocaleString(undefined,{month:'short', year: count>12?'2-digit':undefined}), start, end });
  }
  return months;
}
function monthlyStats(count){
  return monthBuckets(count).map(m => {
    const act = sumActivity(activityInRange(m.start,m.end));
    const gross = grossFYCInRange(m.start,m.end);
    const cb = chargebacksInRange(m.start,m.end);
    const cost = costsTotalInRange(m.start,m.end);
    return { label:m.label, dials:act.dials, sales:act.sales, gross, cb, cost, net: gross-cb-cost };
  });
}

function renderActivity(){
  const range = computeDateRange(dateFilterState.activity.key, dateFilterState.activity.from, dateFilterState.activity.to);
  const t = todayRow();

      ${rangeRows.slice().reverse().map(logRow).join('') || '<p class="helptext">No activity in this range.</p>'}
    </div>
  `;
  wireDateFilter('activity', renderActivity);
  document.getElementById('logDayBtn').onclick = openLogDayModal;
  renderActivityChart(rangeRows);
}

/* ================= BOOK ================= */
function renderBook(filterText, statusFilter){
  filterText = (filterText||'').toLowerCase();
  const range = computeDateRange(dateFilterState.book.key, dateFilterState.book.from, dateFilterState.book.to);
  const placedAll = store.clients.filter(c=>c.status==='active'||c.status==='lapsed');
  const lapsedCount = store.clients.filter(c=>c.status==='lapsed').length;
  const persistency = (placedAll.length) ? Math.round((placedAll.length-lapsedCount)/placedAll.length*100) : 100;
  const st = statement(range.from, range.to);

  const filtered = store.clients.filter(c => {
    // A name/carrier search means "find this specific case," not "browse this range" —
    // scoping it to the date filter too would make an existing client silently invisible.
    // Only apply the date range when browsing without a search term.
    const inRange = filterText || (c.dateSubmitted >= range.from && c.dateSubmitted <= range.to);
    const matchesText = !filterText || c.name.toLowerCase().includes(filterText) || c.carrier.toLowerCase().includes(filterText);
    const matchesStatus = !statusFilter || c.status === statusFilter;
    return inRange && matchesText && matchesStatus;
  }).sort((a,b)=>new Date(b.dateSubmitted)-new Date(a.dateSubmitted));

  mainInner.innerHTML = `
    <div class="page-header"><div><div class="page-eyebrow">Book</div><h1>Clients &amp; cases</h1></div>
    <button class="primary" type="button" id="addClientBtn2">+ Add client</button></div>

    ${dateFilterHTML('book')}

    <div class="grid" style="margin-bottom:18px;">
      <div class="card"><div class="stat-label">Paid FYC</div><div class="stat-value">${fmt(st.gross)}</div></div>
      <div class="card"><div class="stat-label">In Pipeline</div><div class="stat-value" style="color:var(--gold)">${fmt(st.pending)}</div></div>
      <div class="card"><div class="stat-label">Chargebacks</div><div class="stat-value neg">−${fmt(st.cb)}</div></div>
      <div class="card"><div class="stat-label">Persistency</div><div class="stat-value">${persistency}%</div></div>
    </div>
    <div class="book-filters">
      <input id="bookSearch" placeholder="Search client or carrier" value="${filterText}">
      <select id="bookStatus">
        <option value="">All statuses</option>
        <option value="pending" ${statusFilter==='pending'?'selected':''}>Pending</option>
        <option value="approved_not_paid" ${statusFilter==='approved_not_paid'?'selected':''}>Approved not paid</option>
        <option value="active" ${statusFilter==='active'?'selected':''}>Issue paid</option>
        <option value="declined" ${statusFilter==='declined'?'selected':''}>Declined</option>
        <option value="withdrawn" ${statusFilter==='withdrawn'?'selected':''}>Withdrew</option>
        <option value="cancelled" ${statusFilter==='cancelled'?'selected':''}>Cancelled</option>
        <option value="lapsed" ${statusFilter==='lapsed'?'selected':''}>Lapsed</option>
      </select>
    </div>
    <div>${filtered.map(c => { const tag = STATUS_TAG[c.status] || STATUS_TAG.pending; return `
      <div class="case-card">
        <div>
          <button class="case-name-link" onclick="openClientDetail('${c.id}')">${c.name}</button>
          <div class="case-sub">${c.email||'—'} · ${c.phone||'—'}</div>
          <div class="case-sub">${c.carrier} · ${c.product}</div>
          <div class="case-sub">${c.policyNumber || '—'}</div>
        </div>
        <div class="case-right">
          <div class="case-sub">${fmtDateShort(c.dateSubmitted)}</div>
          <div class="case-amount">${c.saleType==='annuity' ? fmt(c.singlePremium) : fmt(c.monthlyPremium)+'/mo'}</div>
          <div class="case-sub">${c.saleType==='annuity'?'SP':'AP'} ${fmt(annualPremium(c))}</div>
          <div style="margin-top:4px;"><span class="tag ${tag.cls}">${tag.label}</span>${c.chargebackAmount?` <span class="helptext" style="color:var(--red);">−${fmt(c.chargebackAmount)} CB</span>`:''}</div>
        </div>
      </div>`; }).join('') || '<p class="helptext">No cases match in this range.</p>'}
    </div>
  `;
  wireDateFilter('book', () => renderBook(filterText, statusFilter));
  document.getElementById('addClientBtn2').onclick = openAddClientModal;
  document.getElementById('bookSearch').oninput = (e) => renderBook(e.target.value, statusFilter);
  document.getElementById('bookStatus').onchange = (e) => renderBook(filterText, e.target.value);
}

    </div>
  `;
  wireDateFilter('costs', renderCosts);
  document.getElementById('addCostBtn').onclick = openAddCostModal;
  if (costLines.length) renderDonut('donutCanvas', costLines);
}
function openEditCostModal(id){
  const cached = costsCache.find(x => x.id === id); // the specific month clicked (for display)
  if (!cached) return;
  const { realId } = parseCostId(id);
  const e = store.costs.find(x => x.id === realId); // the real template row we actually mutate
  if (!e) return;
  const isWeekly = e.recurringFrequency === 'weekly';
  const occurrenceLabel = isWeekly ? fmtDate(cached.date) : new Date(cached.date+'T00:00:00').toLocaleString(undefined, { month:'long', year:'numeric' });
  const freqNoun = isWeekly ? 'weekly' : 'monthly';
  openModal(`
    <div class="modal-head"><h2>Edit cost</h2><button class="modal-close" onclick="closeModal()">×</button></div>
    ${e.isRecurring ? `<p class="helptext" style="margin-top:-4px;">🔁 Recurring ${freqNoun} — changes here apply to every occurrence of this series, past and future. This is the ${occurrenceLabel} instance.</p>` : ''}
    <form id="editCostForm">
      <div class="detail-grid">
        <div><label>Category</label><select name="category">${COST_CATEGORIES.map(c=>`<option value="${c.key}" ${c.key===e.category?'selected':''}>${c.key}</option>`).join('')}</select></div>
        <div><label>Amount ($)</label><input required type="number" step="0.01" name="amount" value="${e.amount}"></div>
        <div class="full ${e.category==='Leads'?'':'section-hidden'}" id="editLeadVendorField" style="grid-column:1/-1;"><label>Lead Vendor</label><input name="vendor" value="${e.vendor||''}" placeholder="e.g. Facebook Leads"></div>
        <div class="full" style="grid-column:1/-1;"><label>Frequency</label><select name="frequency" ${e.isRecurring ? 'disabled' : ''}>
          <option value="onetime" ${!e.isRecurring?'selected':''}>One-time charge</option>
          <option value="recurring_monthly" ${e.isRecurring && !isWeekly?'selected':''}>Recurring monthly charge</option>
          <option value="recurring_weekly" ${e.isRecurring && isWeekly?'selected':''}>Recurring weekly charge</option>
        </select>
        ${e.isRecurring ? `<p class="helptext" style="margin:4px 0 0;">To stop or remove this recurring series, use the buttons below instead.</p>` : ''}
        </div>
        <div class="full" style="grid-column:1/-1;"><label>Date</label><input required type="date" name="date" value="${cached.date}"></div>
        <div class="full" style="grid-column:1/-1;"><label>Description</label><input name="description" value="${e.description||''}" placeholder="Optional"></div>
      </div>
      <div class="modal-actions">
        <button class="primary" type="submit">Save</button>
        ${e.isRecurring ? `<button class="ghost" type="button" id="stopRecurringBtn">Stop recurring after ${occurrenceLabel}</button>` : ''}
        <button class="danger" type="button" id="deleteCostBtn">${e.isRecurring ? 'Delete entire series' : 'Delete'}</button>
        <button class="ghost" type="button" onclick="closeModal()">Cancel</button>
      </div>
    </form>
  `);
  const editCategorySelect = document.querySelector('#editCostForm [name="category"]');
  const editLeadVendorField = document.getElementById('editLeadVendorField');
  editCategorySelect.addEventListener('change', () => {
    editLeadVendorField.classList.toggle('section-hidden', editCategorySelect.value !== 'Leads');
  });
  document.getElementById('editCostForm').addEventListener('submit', (ev) => {
    ev.preventDefault();
    const f = new FormData(ev.target);
    e.category = f.get('category'); e.amount = Number(f.get('amount'));
    e.vendor = f.get('category') === 'Leads' ? (f.get('vendor') || null) : null;
    e.date = f.get('date'); e.description = f.get('description') || '';
    if (f.get('frequency') && !e.isRecurring) {
      e.isRecurring = f.get('frequency') !== 'onetime';
      e.recurringFrequency = f.get('frequency') === 'recurring_weekly' ? 'weekly' : 'monthly';
    }
    saveStore();
    closeModal();
    say("Cost updated.");
    renderCurrentPage();
  });
  const stopBtn = document.getElementById('stopRecurringBtn');
  if (stopBtn) stopBtn.onclick = () => {
    if (!confirm(`Stop this recurring cost after ${occurrenceLabel}? Past occurrences (including this one) keep showing it; ${occurrenceLabel} is the last one it'll be included.`)) return;
    e.recurringEndDate = cached.date;
    saveStore();
    closeModal();
    say("Recurring cost stopped going forward.");
    renderCurrentPage();
  };
  document.getElementById('deleteCostBtn').onclick = () => {
    const msg = e.isRecurring
      ? 'Delete this ENTIRE recurring series? This removes it from every occurrence, including past ones — not just going forward.'
      : 'Delete this cost line?';
    if (!confirm(msg)) return;
    store.costs = store.costs.filter(x => x.id !== realId);
    saveStore();
    closeModal();
    say("Cost deleted.");
    renderCurrentPage();
  };
}

  const commissionPerDial = rangeActivity.dials ? st.gross/rangeActivity.dials : 0;
  const costPerAppointment = rangeActivity.appointments ? st.costsTotal/rangeActivity.appointments : 0;

    <div class="panel">

        <h2 style="margin:0;">Net by month</h2>
        <select id="trendRangeSelect" style="max-width:160px;">
          <option value="3" ${trendMonths===3?'selected':''}>Last 3 months</option>
          <option value="6" ${trendMonths===6?'selected':''}>Last 6 months</option>
          <option value="12" ${trendMonths===12?'selected':''}>Last 12 months</option>
          <option value="ytd" ${trendMonths==='ytd'?'selected':''}>Year to date</option>

      </div>

    </div>

    <div class="panel">

/* ================= COMMISSION CALCULATOR ================= */
// Generic, fictional sample data — NOT Gustin's real FFL comp guide. The real app reads
// live rates from whichever IMO the producer sets in Settings; this demo just needs
// something representative to show the feature working.
const SAMPLE_IMO_NAME = 'Sample IMO';
const SAMPLE_LEVELS = [145, 120, 100, 80, 65];
const SAMPLE_PRODUCTS = [
  { carrier: 'Acme Life', product: 'Instant IUL', rates: [125, 105, 90, 75, 60] },
  { carrier: 'Acme Life', product: 'Term 20', rates: [110, 95, 80, 65, 50] },
  { carrier: 'Northstar Assurance', product: 'Whole Life Secure', rates: [100, 90, 80, 65, 50] },
  { carrier: 'Northstar Assurance', product: 'Final Expense Plus', rates: [130, 110, 95, 80, 60] },
  { carrier: 'Pinnacle Mutual', product: 'Flex UL', rates: [115, 100, 85, 70, 55] },
  { carrier: 'Pinnacle Mutual', product: 'Living Benefit IUL', rates: [120, 105, 90, 75, 60] },
];
const SAMPLE_RATES = SAMPLE_PRODUCTS.flatMap(({ carrier, product, rates }) =>
  SAMPLE_LEVELS.map((level, i) => ({ carrierName: carrier, productName: product, contractLevel: level, payoutRate: rates[i] }))
);
function productTypeLabel(productName){
  const name = productName.toLowerCase();
  if (name.includes('iul')) return 'IUL';
  if (name.includes('gul')) return 'GUL';
  if (name.includes('whole life')) return 'Whole Life';
  if (name.includes('term')) return 'Term';
  if (name.includes('ul')) return 'UL';
  return '';
}
/* ================= ANALYTICS ================= */
function vendorKey(s){ return (s||'Unclassified').trim().toLowerCase() || 'unclassified'; }

// Trailing 3 FULL calendar months, excluding the current in-progress month — see the
// matching note in app.html's baselineWindow() for why.
function baselineWindow(){
  const now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth()-3, 1);
  const end = new Date(now.getFullYear(), now.getMonth(), 0);
  return { from: toISO(start), to: toISO(end) };
}
function computeBlueprint(baseline, targetCommission){
  if (!baseline.dials || !baseline.contacts || !baseline.presentations || !baseline.sales || !baseline.placedCount || !baseline.grossCommission) return null;
  const avgCommissionPerSale = baseline.grossCommission / baseline.placedCount;
  if (!avgCommissionPerSale) return null;
  const contactRate = baseline.contacts / baseline.dials;
  const presentationRate = baseline.presentations / baseline.contacts;
  const closeRatio = baseline.sales / baseline.presentations;

  const requiredSales = Math.ceil(targetCommission / avgCommissionPerSale);
  const requiredPresentations = Math.ceil(requiredSales / closeRatio);
  const requiredContacts = Math.ceil(requiredPresentations / presentationRate);
  const requiredDials = Math.ceil(requiredContacts / contactRate);
  const M = requiredSales / baseline.sales;

  const paths = [{
    key: 'volume', label: 'Do more', sub: 'Same conversion rates, more activity',
    dials: requiredDials, contacts: requiredContacts, presentations: requiredPresentations, sales: requiredSales,
  }];

  const lift = Math.cbrt(M);
  const convContactRate = Math.min(1, contactRate*lift);
  const convPresentationRate = Math.min(1, presentationRate*lift);
  const convCloseRatio = Math.min(1, closeRatio*lift);
  paths.push({
    key: 'conversion', label: 'Convert better', sub: 'Same dial volume, raise every conversion rate',
    dials: baseline.dials,
    contacts: Math.round(baseline.dials*convContactRate),
    presentations: Math.round(baseline.dials*convContactRate*convPresentationRate),
    sales: requiredSales,
    rates: { contactRate: convContactRate, presentationRate: convPresentationRate, closeRatio: convCloseRatio },
  });

  const volumeMultiplier = 1.25;
  const remainingM = M/volumeMultiplier;
  if (remainingM > 1) {
    const blendedDials = Math.ceil(baseline.dials*volumeMultiplier);
    const blLift = Math.cbrt(remainingM);
    const blContactRate = Math.min(1, contactRate*blLift);
    const blPresentationRate = Math.min(1, presentationRate*blLift);
    const blCloseRatio = Math.min(1, closeRatio*blLift);
    paths.push({
      key: 'blended', label: 'Blend both', sub: '+25% dials, plus a smaller rate increase',
      dials: blendedDials,
      contacts: Math.round(blendedDials*blContactRate),
      presentations: Math.round(blendedDials*blContactRate*blPresentationRate),
      sales: requiredSales,
      rates: { contactRate: blContactRate, presentationRate: blPresentationRate, closeRatio: blCloseRatio },
    });
  }
  return { baseline, targetCommission, avgCommissionPerSale, contactRate, presentationRate, closeRatio, requiredSales, paths };
}
function comparisonBar(label, baseVal, targetVal){
  const max = Math.max(baseVal, targetVal, 1);
  const deltaPct = baseVal ? Math.round((targetVal-baseVal)/baseVal*100) : 0;
  const deltaStr = deltaPct > 0 ? `+${deltaPct}%` : `${deltaPct}%`;
  return `<div class="funnel-row">
    <div class="row-top"><span>${label}</span><span>${Math.round(baseVal)} → ${Math.round(targetVal)} <span class="conv">(${deltaStr})</span></span></div>
    <div class="bar-track"><div class="bar-fill" style="width:${Math.min(100, baseVal/max*100)}%; opacity:.45;"></div></div>
    <div class="bar-track" style="margin-top:4px;"><div class="bar-fill bar-fill--target" style="width:${Math.min(100, targetVal/max*100)}%"></div></div>
  </div>`;
}
let analyticsCache = null;
let analyticsTarget = 0;
let analyticsPathKey = 'volume';
function renderBlueprintResult(){
  const el = document.getElementById('blueprintResult');
  if (!el || !analyticsCache) return;
  const blueprint = computeBlueprint(analyticsCache.baseline, analyticsTarget);
  if (!blueprint) {
    el.innerHTML = `<p class="helptext">Not enough activity history yet in the trailing 3 months.</p>`;
    return;
  }
  const path = blueprint.paths.find(p => p.key === analyticsPathKey) || blueprint.paths[0];
  el.innerHTML = `
    <div class="path-row" style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px;">
      ${blueprint.paths.map(p => `<button type="button" class="path-btn ${p.key===path.key?'selected':''}" data-path-key="${p.key}">${p.label}<div class="path-sub">${p.sub}</div></button>`).join('')}
    </div>
    <p class="helptext" style="margin-top:-6px;">To reach ${fmt(blueprint.targetCommission)}/mo (${blueprint.requiredSales} sales/mo at your baseline ${fmt(blueprint.avgCommissionPerSale)}/sale), here's what ${path.label.toLowerCase()} looks like:</p>
    ${comparisonBar('Dials/mo', blueprint.baseline.dials, path.dials)}
    ${comparisonBar('Contacts/mo', blueprint.baseline.contacts, path.contacts)}
    ${comparisonBar('Presentations/mo', blueprint.baseline.presentations, path.presentations)}
    ${comparisonBar('Sales/mo', blueprint.baseline.sales, path.sales)}
    ${path.rates ? `<p class="helptext">Conversion rates in this path: contact ${(path.rates.contactRate*100).toFixed(1)}%, presentation ${(path.rates.presentationRate*100).toFixed(1)}%, close ${(path.rates.closeRatio*100).toFixed(1)}% (baseline: ${(blueprint.contactRate*100).toFixed(1)}% / ${(blueprint.presentationRate*100).toFixed(1)}% / ${(blueprint.closeRatio*100).toFixed(1)}%).</p>` : ''}
  `;
  el.querySelectorAll('.path-btn').forEach(btn => btn.onclick = () => { analyticsPathKey = btn.dataset.pathKey; renderBlueprintResult(); });
}
function renderAnalytics(){
  const range = computeDateRange(dateFilterState.analytics.key, dateFilterState.analytics.from, dateFilterState.analytics.to);
  const baseline = baselineWindow();
  const funnel = sumActivity(activityInRange(range.from, range.to));
  const placedRange = placedInRange(range.from, range.to);
  const avgAP = placedRange.length ? placedRange.reduce((s,c)=>s+annualPremium(c),0)/placedRange.length : 0;

  const spendByVendor = {};
  costsInRange(range.from, range.to).filter(c => c.category === 'Leads').forEach(c => {
    const key = vendorKey(c.vendor);
    spendByVendor[key] ??= { label: c.vendor || 'Unclassified', spend: 0 };
    spendByVendor[key].spend += Number(c.amount);
  });
  const clientsByVendor = {};
  store.clients.filter(c => c.dateSubmitted >= range.from && c.dateSubmitted <= range.to).forEach(c => {
    const key = vendorKey(c.leadVendor);
    clientsByVendor[key] ??= { label: c.leadVendor || 'Unclassified', total: 0, placed: 0 };
    clientsByVendor[key].total += 1;
    if (c.status === 'active' || c.status === 'lapsed') clientsByVendor[key].placed += 1;
  });
  const vendorKeys = [...new Set([...Object.keys(spendByVendor), ...Object.keys(clientsByVendor)])];
  const vendorRows = vendorKeys.map(key => {
    const spend = spendByVendor[key]?.spend || 0;
    const c = clientsByVendor[key] || { total: 0, placed: 0 };
    const label = spendByVendor[key]?.label || clientsByVendor[key]?.label || 'Unclassified';
    return { label, spend, total: c.total, placed: c.placed };
  }).sort((a,b) => b.spend - a.spend || b.total - a.total);

  const baselineFunnel = sumActivity(activityInRange(baseline.from, baseline.to));
  const baselinePlaced = placedInRange(baseline.from, baseline.to);
  analyticsCache = {
    baseline: { ...baselineFunnel, grossCommission: grossFYCInRange(baseline.from, baseline.to), placedCount: baselinePlaced.length },
  };
  if (!analyticsTarget) {
    const baselineMonthlyAvg = grossFYCInRange(baseline.from, baseline.to) / 3;
    analyticsTarget = Math.ceil((baselineMonthlyAvg * 1.5) / 1000) * 1000 || 10000;
  }

  mainInner.innerHTML = `
    <div class="page-header"><div><div class="page-eyebrow">Analytics</div><h1>Grow your book</h1></div></div>
    ${dateFilterHTML('analytics')}

    <div class="panel">
      <h2>Conversion rates</h2>
      <p class="helptext" style="margin:-8px 0 14px;">${fmtDateRangeLabel(range.from)}–${fmtDateRangeLabel(range.to)}</p>
      <div class="grid grid-5">
        <div class="card"><div class="stat-label">Contact Rate</div><div class="stat-value">${pct(funnel.contacts, funnel.dials)}</div><div class="stat-sub">${funnel.contacts} of ${funnel.dials} dials</div></div>
        <div class="card"><div class="stat-label">Presentation Rate</div><div class="stat-value">${pct(funnel.presentations, funnel.contacts)}</div><div class="stat-sub">${funnel.presentations} of ${funnel.contacts} contacts</div></div>
        <div class="card"><div class="stat-label">Close Ratio</div><div class="stat-value">${pct(funnel.sales, funnel.presentations)}</div><div class="stat-sub">${funnel.sales} of ${funnel.presentations} presentations</div></div>
        <div class="card"><div class="stat-label">Average AP</div><div class="stat-value">${fmt(avgAP)}</div><div class="stat-sub">${placedRange.length} placed case${placedRange.length===1?'':'s'}</div></div>
      </div>
    </div>

    <div class="panel">
      <h2>Lead vendor performance</h2>
      <p class="helptext" style="margin:-8px 0 14px;">Spend is from Costs logged under "Leads" in this range; conversion is the share of that vendor's clients who became a placed case.</p>
      ${vendorRows.length ? `
      <table><thead><tr><th>Vendor</th><th>Spend</th><th>Clients</th><th>Placed</th><th>Conversion</th></tr></thead>
      <tbody>${vendorRows.map(v => `<tr><td>${v.label}</td><td>${fmt(v.spend)}</td><td>${v.total}</td><td>${v.placed}</td><td>${pct(v.placed, v.total)}</td></tr>`).join('')}</tbody></table>
      ` : '<p class="helptext">No clients or lead costs logged in this range yet.</p>'}
    </div>

    <div class="panel">
      <h2>Goal blueprint</h2>
      <p class="helptext" style="margin:-8px 0 14px;">Based on your trailing 3 full months (${fmtDateRangeLabel(baseline.from)}–${fmtDateRangeLabel(baseline.to)}), independent of the date range above.</p>
      <div style="max-width:260px; margin-bottom:16px;">
        <label>Target monthly commission ($)</label><input type="number" step="100" id="blueprintTargetInput" value="${analyticsTarget}">
      </div>
      <div id="blueprintResult"></div>
    </div>
  `;
  wireDateFilter('analytics', renderAnalytics);
  document.getElementById('blueprintTargetInput').addEventListener('input', (e) => {
    analyticsTarget = Number(e.target.value) || 0;
    renderBlueprintResult();
  });
  renderBlueprintResult();
}

        `;
        advanceEl.innerHTML = `
          <p class="helptext">The carrier advances <strong>75%</strong> of the first-year commission up front — that's 9 of the 12 months, paid to you net as soon as the policy is issued and paid. The remaining <strong>25%</strong> (the last 3 months) isn't advanced — the carrier pays it out as it's earned, in months 10, 11, and 12 of the policy.</p>
          <table class="statement-table" style="margin-top:10px;">
            <tbody>
              <tr><td>Net Advance Paid Now (75%)</td><td>${fmt(advanceNow)}</td></tr>
              <tr><td>Held-Back Balance (25%, months 10–12)</td><td>${fmt(heldBack)}</td></tr>
            </tbody>
          </table>
          <table class="statement-table" style="margin-top:14px;">
            <thead><tr><th>Policy Month</th><th>Paid To You</th></tr></thead>
            <tbody>
              <tr><td>1 – 9 (advanced now)</td><td>${fmt(advanceNow)}</td></tr>
              <tr><td>Month 10</td><td>${fmt(monthly)}</td></tr>
              <tr><td>Month 11</td><td>${fmt(monthly)}</td></tr>
              <tr><td>Month 12</td><td>${fmt(monthly)}</td></tr>
            </tbody>
          </table>
          <p class="helptext" style="margin-top:10px;">Rough estimate only — actual advance schedules vary by carrier.</p>
        `;
      } else {
        resultEl.innerHTML = `<p class="helptext">${sel.carrier} — ${sel.product} isn't offered at a ${level}% contract level (no rate on file).</p>`;
        advanceEl.innerHTML = `<p class="helptext">Pick a product with a rate at this contract level to see its advance schedule.</p>`;
      }
    }

    const compareBody = document.getElementById('calcCompareBody');
    const atLevel = SAMPLE_RATES.filter(r => r.contractLevel === level).sort((a,b) => Number(b.payoutRate) - Number(a.payoutRate));
    compareBody.innerHTML = atLevel.map(r => `<tr><td>${r.carrierName}</td><td>${r.productName}</td><td>${r.payoutRate}%</td><td>${fmt(premium * Number(r.payoutRate) / 100)}</td></tr>`).join('')
      || '<tr><td colspan="4" class="helptext">No products on file at this contract level.</td></tr>';
  }

  document.getElementById('calcLevel').addEventListener('input', recompute);
  document.getElementById('calcPremium').addEventListener('input', recompute);
  renderProductCards(carriers[0]);
  document.querySelectorAll('#calcCarrierPicker .carrier-pill').forEach(pill => {
    pill.onclick = () => {
      document.querySelectorAll('#calcCarrierPicker .carrier-pill').forEach(p => p.classList.remove('selected'));
      pill.classList.add('selected');
      renderProductCards(pill.dataset.carrier);
      recompute();
    };
  });
  recompute();
}

/* ================= FEEDBACK ================= */
function renderFeedback(){
  mainInner.innerHTML = `
    <div class="page-header"><div><div class="page-eyebrow">Feedback</div><h1>Have a suggestion? Want to request a feature? Need to report a bug?</h1></div></div>
    <p class="helptext" style="margin-top:-10px;">Send instant feedback directly to our developer team so we can continue to improve your experience.</p>
    <p class="helptext" style="margin-top:-6px;"><em>Tour mode — your message stays in this browser and isn't actually sent anywhere. Start a trial to reach us for real.</em></p>

    <div class="panel">
      <h2>Send a suggestion</h2>
      <form class="entry" id="suggestionForm">
        <div class="full" style="grid-column:1/-1;"><label>What's on your mind?</label><textarea required name="message" rows="4" placeholder="e.g. It would help if the Book tab let me filter by carrier..." style="width:100%; font:inherit; padding:10px; border:1.5px solid var(--line); border-radius:10px; background:var(--cream);"></textarea></div>
        <div class="full"><button class="primary" type="submit">Send</button></div>
      </form>
    </div>

    <div class="panel">
      <h2>Your submissions (this browser only)</h2>
      ${store.suggestions.length ? `
      <table><thead><tr><th>Sent</th><th>Message</th></tr></thead>
      <tbody>${store.suggestions.map(s => `<tr><td>${fmtDate(s.date)}</td><td>${s.message}</td></tr>`).join('')}</tbody></table>
      ` : '<p class="helptext">Nothing submitted yet.</p>'}
    </div>
  `;
  document.getElementById('suggestionForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    store.suggestions.unshift({ id: uid('s'), message: f.get('message'), date: todayISO() });
    saveStore();
    say('Thanks — sent!');
    renderFeedback();
  });
}

/* ---- Bob's speech bubble, wired once per page mount ---- */
let say = () => {};

/* ---- nav ---- */
const PAGES = { desk: renderDesk, activity: renderActivity, book: () => renderBook('',''), costs: renderCosts, profit: renderProfit, goals: renderGoals, analytics: renderAnalytics, calculator: renderCalculator, feedback: renderFeedback };
let currentPage = 'desk';
function renderCurrentPage(){ PAGES[currentPage](); }
function go(page){
  currentPage = page;
  document.querySelectorAll('#sidebarNav button, .sidebar-footer button[data-page]').forEach(b => b.classList.toggle('active', b.dataset.page === page));
  PAGES[page]();
}
document.querySelectorAll('#sidebarNav button, .sidebar-footer button[data-page]').forEach(b => b.onclick = () => go(b.dataset.page));

document.getElementById('resetDemoBtn').onclick = () => {
  if (!confirm('Reset the sample book back to its original demo data? This clears everything you added in this browser.')) return;
  localStorage.removeItem(STORE_KEY);
  store = loadStore();
  renderCurrentPage();
};

say = wireMascot('navMascot', ["Hi, I'm Bob!", "This is a sample book — try the real thing!", "Edits here stay in your browser."]);
go('desk');
</script>
