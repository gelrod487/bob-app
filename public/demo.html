<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BOB — Sample Book</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<link rel="stylesheet" href="/css/bob.css">
</head>
<body>
<div class="demo-banner">
  <span>Sample book — edits stay in this browser. Start a trial to keep your own cases.</span>
  <a class="primary" href="/login.html">Start 14-day trial</a>
</div>
<div class="app-shell">
  <div class="sidebar">
    <div class="brand"><div id="navMascot" style="width:26px; height:34px;"></div><span class="brand-name" style="font-size:1rem;">Bob's got you covered</span></div>
    <div class="sidebar-nav" id="sidebarNav">
      <button data-page="desk" class="active"><span class="ic">🗂️</span>Desk</button>
      <button data-page="activity"><span class="ic">📞</span>Activity</button>
      <button data-page="book"><span class="ic">📖</span>Book</button>
      <button data-page="costs"><span class="ic">🧾</span>Costs</button>
      <button data-page="profit"><span class="ic">📈</span>Profit</button>
    </div>
    <div class="sidebar-footer">
      <a class="ghost" href="/" style="text-align:center;">← Back home</a>
    </div>
  </div>

  <div class="main-area">
    <div class="main-inner" id="mainInner"></div>
  </div>
</div>

<script src="/js/mascot.js"></script>
<script>
wireMascot('navMascot', ["Hi, I'm Bob!", "This is a sample book — try the real thing!", "Edits here stay in your browser."]);
/* ---- sample dataset (static — matches the numbers shown on the marketing site) ---- */
const BASE = {
  netProfit: 76, grossCommission: 5681, placedCount: 4, pendingPremium: 1764,
  chargebacks: 964, lapsedCount: 1, operatingCosts: 4641,
  funnel: { dials: 392, appointments: 18, presentations: 14, sales: 4 },
  goals: { dials: [315, 400], appointments: [14, 20], sits: [11, 16], sales: [3, 16], fyc: [0, 15000] },
  netByMonth: { labels: ['May','Jun','Jul','Aug','Sep'], data: [900, 3400, 2100, -1800, -1200] },
  cases: [
    { name:'Maria Delgado', email:'maria.delgado@example.com', phone:'(210) 555-0142', carrier:'Americo', product:'Instant IUL', policyNumber:'AM-10482', issued:'Jul 14', monthly:187.40, ap:2248.80, status:'issued' },
    { name:'James Whitaker', email:'jwhitaker@example.com', phone:'(512) 555-0198', carrier:'Mutual of Omaha', product:'Living Promise', policyNumber:'BU-552190', issued:'Aug 3', monthly:62.10, ap:745.20, status:'issued' },
    { name:'Elena Ruiz', email:'elena.ruiz@example.com', phone:'(830) 555-0110', carrier:'National Life', product:'Flexlife IUL', policyNumber:'LS-220188', issued:'Aug 21', monthly:210.00, ap:2520.00, status:'pending' },
    { name:'Robert Chen', email:'rchen@example.com', phone:'(713) 555-0166', carrier:'Transamerica', product:'FE Express', policyNumber:'FEX-91822', issued:'Jun 11', monthly:94.50, ap:1134.00, status:'lapsed', chargeback:964 },
    { name:'Danielle Brooks', email:'dbrooks@example.com', phone:'(469) 555-0177', carrier:'F&G', product:'Pathsetter IUL', policyNumber:'FG-44012', issued:'May 22', monthly:312.00, ap:3744.00, status:'issued' },
  ],
  costs: [
    { label:'Lead flow', amount:2480, color:'#FF6B35' },
    { label:'Staff', amount:1280, color:'#1B998B' },
    { label:'Travel', amount:640, color:'#FF8C69' },
    { label:'CRM / tools', amount:189, color:'#F7A934' },
    { label:'E&O insurance', amount:52, color:'#5A3825' },
  ],
};

/* ---- today's tally lives in localStorage so +/- feels real, but never leaves the browser ---- */
const LS_KEY = 'bob_demo_today_v1';
function loadToday(){ try { return JSON.parse(localStorage.getItem(LS_KEY)) || {dials:0,appointments:0,presentations:0,sales:0}; } catch(e){ return {dials:0,appointments:0,presentations:0,sales:0}; } }
function saveToday(t){ try { localStorage.setItem(LS_KEY, JSON.stringify(t)); } catch(e){} }
let today = loadToday();

function fmt(n){ return '$'+Number(n||0).toLocaleString(undefined,{maximumFractionDigits:0}); }
function pct(a,b){ return b ? ((a/b)*100).toFixed(1)+'%' : '0%'; }

const mainInner = document.getElementById('mainInner');

/* ================= DESK ================= */
function renderDesk(){
  const dials = BASE.funnel.dials + today.dials;
  const appts = BASE.funnel.appointments + today.appointments;
  const pres = BASE.funnel.presentations + today.presentations;
  const sales = BASE.funnel.sales + today.sales;

  mainInner.innerHTML = `
    <div class="page-header"><div><div class="page-eyebrow">Desk</div><h1>Sample producer's book</h1></div>
    <a class="ghost" href="#" onclick="return false;">Add a client ↗</a></div>

    <div class="grid" style="margin-bottom:18px;">
      <div class="card"><div class="stat-label">Net Profit</div><div class="stat-value pos">${fmt(BASE.netProfit)}</div><div class="stat-sub">After chargebacks and costs</div></div>
      <div class="card"><div class="stat-label">Gross Commission</div><div class="stat-value">${fmt(BASE.grossCommission)}</div><div class="stat-sub">${BASE.placedCount} placed · ${fmt(BASE.pendingPremium)} pending</div></div>
      <div class="card"><div class="stat-label">Chargebacks</div><div class="stat-value neg">−${fmt(BASE.chargebacks)}</div><div class="stat-sub">${BASE.lapsedCount} lapsed</div></div>
      <div class="card"><div class="stat-label">Operating Costs</div><div class="stat-value">${fmt(BASE.operatingCosts)}</div><div class="stat-sub">${fmt(BASE.operatingCosts/BASE.placedCount)} / sale</div></div>
    </div>

    <div class="panel">
      <h2>Today</h2>
      <div class="stepper-grid">
        ${['dials','appointments','presentations','sales'].map(f => `
          <div class="stepper-box">
            <button class="stepper-btn" onclick="bump('${f}',-1)">−</button>
            <div class="count-wrap"><span class="count" id="today-${f}">${today[f]}</span><span class="count-label">${f}</span></div>
            <button class="stepper-btn" onclick="bump('${f}',1)">+</button>
          </div>`).join('')}
      </div>
    </div>

    <div class="panel">
      <h2>Production funnel</h2>
      <p class="helptext" style="margin:-8px 0 14px;">${dials} dials · ${appts} set · ${pres} sits · ${sales} sales</p>
      ${funnelRow('Dials', dials, dials, null)}
      ${funnelRow('Appointments set', appts, dials, pct(appts,dials))}
      ${funnelRow('Presentations', pres, dials, pct(pres,appts))}
      ${funnelRow('Sales', sales, dials, pct(sales,pres))}
      <p class="helptext">${pct(sales,dials)} of dials became a sale.</p>

      <div class="goal-grid">
        ${goalCell('Dials', BASE.goals.dials)}
        ${goalCell('Appts', BASE.goals.appointments)}
        ${goalCell('Sits', BASE.goals.sits)}
        ${goalCell('Sales', BASE.goals.sales)}
        ${goalCell('FYC', BASE.goals.fyc, true)}
      </div>
    </div>

    <div class="panel">
      <h2>Net by month</h2>
      <p class="helptext" style="margin:-8px 0 14px;">Commission minus chargebacks and overhead</p>
      <div class="chart-box"><canvas id="netChart"></canvas></div>
    </div>

    <div class="panel">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;"><h2 style="margin:0;">Recent cases</h2><a href="#" onclick="go('book');return false;" style="font-size:.85rem; font-weight:700; color:var(--maroon); text-decoration:none;">Open book</a></div>
      ${BASE.cases.map(caseRow).join('')}
    </div>

    <div class="panel">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;"><h2 style="margin:0;">Where the money goes</h2><a href="#" onclick="go('costs');return false;" style="font-size:.85rem; font-weight:700; color:var(--maroon); text-decoration:none;">All costs</a></div>
      ${donutBlock()}
    </div>
  `;

  renderNetChart();
  renderDonut('donutCanvas');
}

function funnelRow(label, value, total, conv){
  return `<div class="funnel-row">
    <div class="row-top"><span>${label}</span><span>${value}${conv ? ` <span class="conv">· ${conv} conv</span>`:''}</span></div>
    <div class="bar-track"><div class="bar-fill" style="width:${total ? (value/total*100) : 0}%"></div></div>
  </div>`;
}
function goalCell(label, [have, target], isMoney){
  const pctVal = target ? Math.min(100, (have/target)*100) : 0;
  return `<div class="goal-cell">
    <div class="glabel">${label}</div>
    <div class="gvalue">${isMoney ? fmt(have) : have} / ${isMoney ? fmt(target) : target}</div>
    <div class="bar-track"><div class="bar-fill" style="width:${pctVal}%"></div></div>
  </div>`;
}
function caseRow(c){
  const tagClass = c.status === 'issued' ? 'active-pol' : c.status === 'lapsed' ? 'lapsed' : 'pending';
  const tagLabel = c.status === 'issued' ? 'Issued — paid' : c.status === 'lapsed' ? 'Lapsed' : 'Pending';
  return `<div class="case-card">
    <div><div class="case-name">${c.name}</div><div class="case-sub">${c.product} · ${c.carrier} · ${c.issued}</div></div>
    <div class="case-right">
      <div class="case-amount">${fmt(c.status === 'pending' ? c.ap : c.monthly*12)}</div>
      <div style="margin-top:4px;"><span class="tag ${tagClass}">${tagLabel}</span>${c.chargeback ? ` <span class="helptext" style="color:var(--red);">−${fmt(c.chargeback)} CB</span>`:''}</div>
    </div>
  </div>`;
}
function donutBlock(){
  const total = BASE.costs.reduce((s,c)=>s+c.amount,0);
  return `<div class="donut-wrap">
    <div class="chart-box" style="width:180px; height:180px; flex-shrink:0;"><canvas id="donutCanvas"></canvas></div>
    <div class="donut-legend">
      ${BASE.costs.map(c => `<div class="donut-legend-row"><span><span class="dot" style="background:${c.color}"></span>${c.label}</span><span>${fmt(c.amount)}</span></div>`).join('')}
    </div>
  </div>
  <p class="helptext" style="margin-top:14px;">Persistency on placed cases: 75% · $1,764 sitting in pending</p>`;
}

let netChart, donutChart;
function renderNetChart(){
  const ctx = document.getElementById('netChart');
  if (!ctx) return;
  if (netChart) netChart.destroy();
  netChart = new Chart(ctx, { type:'line', data:{ labels: BASE.netByMonth.labels, datasets:[{
    data: BASE.netByMonth.data, borderColor:'#FF6B35', backgroundColor:'rgba(255,107,53,.15)',
    fill:true, tension:.45, cubicInterpolationMode:'monotone', pointRadius:0,
  }]}, options:{ responsive:true, maintainAspectRatio:false,
    plugins:{ legend:{ display:false } },
    scales:{ x:{ ticks:{ color:getComputedStyle(document.body).color } }, y:{ ticks:{ color:getComputedStyle(document.body).color } } } } });
}
function renderDonut(id){
  const ctx = document.getElementById(id);
  if (!ctx) return;
  if (donutChart) donutChart.destroy();
  donutChart = new Chart(ctx, { type:'doughnut', data:{
    labels: BASE.costs.map(c=>c.label), datasets:[{ data: BASE.costs.map(c=>c.amount), backgroundColor: BASE.costs.map(c=>c.color) }]
  }, options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ display:false } }, cutout:'68%' } });
}

function bump(field, delta){
  today[field] = Math.max(0, today[field] + delta);
  saveToday(today);
  document.getElementById('today-'+field).textContent = today[field];
  renderDeskFunnelOnly();
}
function renderDeskFunnelOnly(){
  // cheap full re-render keeps funnel/goal math in sync without duplicating the formulas
  renderDesk();
}

/* ================= ACTIVITY ================= */
function renderActivity(){
  mainInner.innerHTML = `
    <div class="page-header"><div><div class="page-eyebrow">Activity</div><h1>Daily production log</h1></div></div>
    <div class="panel">
      <h2>Today</h2>
      <div class="stepper-grid">
        ${['dials','appointments','presentations','sales'].map(f => `
          <div class="stepper-box">
            <button class="stepper-btn" onclick="bump('${f}',-1)">−</button>
            <div class="count-wrap"><span class="count" id="today-${f}">${today[f]}</span><span class="count-label">${f}</span></div>
            <button class="stepper-btn" onclick="bump('${f}',1)">+</button>
          </div>`).join('')}
      </div>
    </div>
    <div class="panel">
      <h2>Last 5 days (sample)</h2>
      <table><thead><tr><th>Date</th><th>Dials</th><th>Appts</th><th>Sits</th><th>Sales</th></tr></thead>
      <tbody>
        <tr><td>Sep 18</td><td>88</td><td>4</td><td>3</td><td>1</td></tr>
        <tr><td>Sep 17</td><td>76</td><td>3</td><td>2</td><td>0</td></tr>
        <tr><td>Sep 16</td><td>91</td><td>5</td><td>4</td><td>2</td></tr>
        <tr><td>Sep 15</td><td>0</td><td>0</td><td>0</td><td>0</td></tr>
        <tr><td>Sep 14</td><td>82</td><td>3</td><td>3</td><td>1</td></tr>
      </tbody></table>
    </div>
  `;
}

/* ================= BOOK ================= */
function renderBook(filterText, statusFilter){
  filterText = (filterText||'').toLowerCase();
  const filtered = BASE.cases.filter(c =>
    (!filterText || c.name.toLowerCase().includes(filterText) || c.email.includes(filterText)) &&
    (!statusFilter || c.status === statusFilter)
  );
  mainInner.innerHTML = `
    <div class="page-header"><div><div class="page-eyebrow">Book</div><h1>Clients &amp; cases</h1></div>
    <a class="primary" href="#" onclick="return false;">+ Add client</a></div>
    <div class="grid" style="margin-bottom:18px;">
      <div class="card"><div class="stat-label">Paid FYC</div><div class="stat-value">${fmt(BASE.grossCommission)}</div></div>
      <div class="card"><div class="stat-label">In Pipeline</div><div class="stat-value" style="color:var(--gold)">${fmt(BASE.pendingPremium)}</div></div>
      <div class="card"><div class="stat-label">Chargebacks</div><div class="stat-value neg">−${fmt(BASE.chargebacks)}</div></div>
      <div class="card"><div class="stat-label">Persistency</div><div class="stat-value">75%</div></div>
    </div>
    <div class="book-filters">
      <input id="bookSearch" placeholder="Search name, email, phone" value="${filterText}">
      <select id="bookStatus">
        <option value="">All statuses</option>
        <option value="issued" ${statusFilter==='issued'?'selected':''}>Issued</option>
        <option value="pending" ${statusFilter==='pending'?'selected':''}>Pending</option>
        <option value="lapsed" ${statusFilter==='lapsed'?'selected':''}>Lapsed</option>
      </select>
    </div>
    <div>${filtered.map(c => `
      <div class="case-card">
        <div>
          <div class="case-name">${c.name}</div>
          <div class="case-sub">${c.email} · ${c.phone}</div>
          <div class="case-sub">${c.carrier} · ${c.product}</div>
          <div class="case-sub">${c.policyNumber}</div>
        </div>
        <div class="case-right">
          <div class="case-sub">${c.issued}</div>
          <div class="case-amount">${fmt(c.monthly)}/mo</div>
          <div class="case-sub">AP ${fmt(c.ap)}</div>
          <div style="margin-top:4px;"><span class="tag ${c.status==='issued'?'active-pol':c.status==='lapsed'?'lapsed':'pending'}">${c.status==='issued'?'Issued':c.status==='lapsed'?'Lapsed':'Pending'}</span>${c.chargeback?` <span class="helptext" style="color:var(--red);">−${fmt(c.chargeback)} CB</span>`:''}</div>
        </div>
      </div>`).join('') || '<p class="helptext">No cases match.</p>'}
    </div>
  `;
  document.getElementById('bookSearch').oninput = (e) => renderBook(e.target.value, statusFilter);
  document.getElementById('bookStatus').onchange = (e) => renderBook(filterText, e.target.value);
}

/* ================= COSTS ================= */
function renderCosts(){
  mainInner.innerHTML = `
    <div class="page-header"><div><div class="page-eyebrow">Costs</div><h1>Where the money goes</h1></div></div>
    <div class="panel">${donutBlock()}</div>
    <div class="panel">
      <h2>All cost lines</h2>
      <table><thead><tr><th>Category</th><th>Amount</th></tr></thead>
      <tbody>${BASE.costs.map(c=>`<tr><td>${c.label}</td><td>${fmt(c.amount)}</td></tr>`).join('')}</tbody></table>
    </div>
  `;
  renderDonut('donutCanvas');
}

/* ================= PROFIT ================= */
function renderProfit(){
  mainInner.innerHTML = `
    <div class="page-header"><div><div class="page-eyebrow">Profit</div><h1>Net profit, month by month</h1></div></div>
    <div class="grid" style="margin-bottom:18px;">
      <div class="card"><div class="stat-label">Net Profit YTD</div><div class="stat-value pos">${fmt(BASE.netProfit)}</div></div>
      <div class="card"><div class="stat-label">Gross Commission</div><div class="stat-value">${fmt(BASE.grossCommission)}</div></div>
      <div class="card"><div class="stat-label">Chargebacks</div><div class="stat-value neg">−${fmt(BASE.chargebacks)}</div></div>
      <div class="card"><div class="stat-label">Operating Costs</div><div class="stat-value">${fmt(BASE.operatingCosts)}</div></div>
    </div>
    <div class="panel">
      <h2>Net by month</h2>
      <div class="chart-box"><canvas id="netChart"></canvas></div>
    </div>
  `;
  renderNetChart();
}

/* ---- nav ---- */
const PAGES = { desk: renderDesk, activity: renderActivity, book: () => renderBook('',''), costs: renderCosts, profit: renderProfit };
function go(page){
  document.querySelectorAll('#sidebarNav button').forEach(b => b.classList.toggle('active', b.dataset.page === page));
  PAGES[page]();
}
document.querySelectorAll('#sidebarNav button').forEach(b => b.onclick = () => go(b.dataset.page));

go('desk');
</script>
</body>
</html>
