<script src="/js/mascot.js"></script>
<script>
wireMascot('navMascot', ["Hi, I'm Bob!", "This is a sample book — try the real thing!", "Edits here stay in your browser."]);

/* ============================================================
   date helpers
   ============================================================ */
function toISO(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function todayISO(){ return toISO(new Date()); }
function addDays(iso, n){ const d = new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return toISO(d); }
function daysAgoISO(n){ const d = new Date(); d.setDate(d.getDate()-n); return toISO(d); }
function monthsAgoISO(n, day){ const d = new Date(); d.setDate(1); d.setMonth(d.getMonth()-n); if (day) d.setDate(Math.min(day,28)); return toISO(d); }
function fmt(n){ return '$'+Number(n||0).toLocaleString(undefined,{maximumFractionDigits:0}); }
function fmtMoney2(n){ return '$'+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2}); }
function fmtDate(iso){ if(!iso) return '—'; return new Date(iso+'T00:00:00').toLocaleDateString(undefined,{month:'short', day:'numeric', year:'numeric'}); }
function fmtDateShort(iso){ if(!iso) return '—'; return new Date(iso+'T00:00:00').toLocaleDateString(undefined,{month:'short', day:'numeric'}); }
function pct(a,b){ return b ? ((a/b)*100).toFixed(1)+'%' : '0%'; }
function uid(prefix){ return prefix+'_'+Math.random().toString(36).slice(2,9); }

/* ============================================================
   persisted store (clients, daily activity, cost lines) — all
   local to this browser, seeded once with ~14 months of sample
   history so every report/filter has something real to show.
   ============================================================ */
const STORE_KEY = 'bob_demo_store_v4';
const COST_CATEGORIES = [
  { key:'Lead flow',      color:'#7A3B4A' },
  { key:'Marketing',      color:'#A63D40' },
  { key:'E&O insurance',  color:'#D8CBB8' },
  { key:'Licenses',       color:'#9A8F7C' },
  { key:'CRM/Tools',      color:'#7C9473' },
  { key:'Office',         color:'#D4A373' },
  { key:'Travel',         color:'#C9986B' },
  { key:'Staff',          color:'#5F7A6E' },
  { key:'Insurance',      color:'#8C5B63' },
  { key:'Other',          color:'#B7ADA0' },
];
function costColor(cat){ return (COST_CATEGORIES.find(c=>c.key===cat) || {}).color || '#B7ADA0'; }

function seedStore(){
  const CARRIERS = ['Americo','Mutual of Omaha','National Life','Transamerica','F&G','Foresters','Corebridge'];
  const PRODUCTS = ['Instant IUL','Living Promise','Flexlife IUL','FE Express','Pathsetter IUL','Term 20','Whole Life'];
  const NAMES = ['Maria Delgado','James Whitaker','Elena Ruiz','Robert Chen','Danielle Brooks','Carlos Mendoza','Ashley Cooper','Michael Torres','Sarah Kim','David Nguyen','Patricia Owens','Kevin Walsh','Nicole Foster','Brian Alvarez'];
  const LEAD_VENDORS = ['Facebook Leads','Google Ads','Referral','Direct Mail','Aged Leads Co'];
  const LEAD_TYPES = ['Final Expense','Mortgage Protection','IUL','Annuity Lead'];
  const MONTHLIES = [62.10,94.50,120.00,150.00,187.40,210.00,240.00,312.00,275.00,98.00,155.00,205.00,132.00,178.50];
  const STATUS_PLAN = ['issued','issued','pending','lapsed','issued','issued','pending','issued','issued','issued','lapsed','issued','pending','issued'];

  const clients = NAMES.map((name, i) => {
    const monthsBack = 13 - Math.floor(i * 13 / (NAMES.length - 1)); // spreads ~0..13 months back, oldest first
    let dayOfMonth = 3 + (i*7)%24;
    if (monthsBack === 0) dayOfMonth = Math.min(dayOfMonth, new Date().getDate() - 1); // never seed a future date
    const submitted = monthsAgoISO(monthsBack, dayOfMonth);
    const status = STATUS_PLAN[i];
    const monthlyPremium = MONTHLIES[i];
    const isPlaced = status === 'issued' || status === 'lapsed';
    const approvedDate = isPlaced ? addDays(submitted, 5) : null;
    const issueDate = isPlaced ? addDays(submitted, 9) : null;
    const issuePaidFYC = isPlaced ? Math.round(monthlyPremium * 12 * 0.75) : 0;
    const chargebackAmount = status === 'lapsed' ? issuePaidFYC : 0;
    const chargebackDate = status === 'lapsed' ? addDays(issueDate, 60) : null;
    return {
      id: uid('c'), name,
      email: name.toLowerCase().replace(/[^a-z]+/g,'.') + '@example.com',
      phone: `(${200+i*11}) 555-0${100+i*7}`,
      carrier: CARRIERS[i % CARRIERS.length],
      product: PRODUCTS[i % PRODUCTS.length],
      policyNumber: status === 'pending' ? null : `${CARRIERS[i % CARRIERS.length].slice(0,2).toUpperCase()}-${10000+i*137}`,
      faceAmount: Math.round(monthlyPremium * 12 * 18),
      monthlyPremium, status,
      leadVendor: LEAD_VENDORS[i % LEAD_VENDORS.length],
      leadType: LEAD_TYPES[i % LEAD_TYPES.length],
      dateSubmitted: submitted, approvedDate, issueDate, issuePaidFYC,
      chargebackAmount, chargebackDate,
      notes: '',
    };
  });

  // ~11 months of weekday activity, with occasional zero/skip days for realism
  const activity = [];
  for (let d = 335; d >= 0; d--) {
    const iso = daysAgoISO(d);
    const dow = new Date(iso+'T00:00:00').getDay();
    if (dow === 0 || dow === 6) continue; // skip weekends
    if (Math.random() < 0.08) continue; // the occasional day off
    const dials = 55 + Math.floor(Math.random()*55);
    const appointments = Math.round(dials * (0.035 + Math.random()*0.03));
    const presentations = Math.round(appointments * (0.55 + Math.random()*0.3));
    const sales = Math.round(presentations * (0.15 + Math.random()*0.25));
    activity.push({ date: iso, dials, appointments, presentations, sales });
  }

  // cost lines spread over the last ~11 months across every category
  const costs = [];
  for (let m = 10; m >= 0; m--) {
    COST_CATEGORIES.forEach((cat, ci) => {
      if (Math.random() < 0.12) return; // not every category every month
      const base = { 'Lead flow':320,'Marketing':110,'E&O insurance':45,'Licenses':35,'CRM/Tools':85,'Office':55,'Travel':65,'Staff':60,'Insurance':50,'Other':30 }[cat.key] || 40;
      const amount = Math.round(base * (0.7 + Math.random()*0.7));
      costs.push({ id: uid('e'), date: monthsAgoISO(m, 5 + ci*2), amount, category: cat.key, description: '' });
    });
  }

  return { clients, activity, costs };
}
function loadStore(){
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e){}
  const fresh = seedStore();
  try { localStorage.setItem(STORE_KEY, JSON.stringify(fresh)); } catch(e){}
  return fresh;
}
function saveStore(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch(e){} }
let store = loadStore();

function annualPremium(c){ return c.monthlyPremium * 12; }
function clientsSubmittedInRange(from,to){ return store.clients.filter(c => c.dateSubmitted >= from && c.dateSubmitted <= to); }
function activityInRange(from,to){ return store.activity.filter(a => a.date >= from && a.date <= to); }
function costsInRange(from,to){ return store.costs.filter(c => c.date >= from && c.date <= to); }
function sumActivity(rows){ return rows.reduce((s,r)=>({dials:s.dials+r.dials, appointments:s.appointments+r.appointments, presentations:s.presentations+r.presentations, sales:s.sales+r.sales}), {dials:0,appointments:0,presentations:0,sales:0}); }
function grossFYCInRange(from,to){ return store.clients.filter(c => (c.status==='issued'||c.status==='lapsed') && c.issueDate>=from && c.issueDate<=to).reduce((s,c)=>s+c.issuePaidFYC,0); }
function placedInRange(from,to){ return store.clients.filter(c => (c.status==='issued'||c.status==='lapsed') && c.issueDate>=from && c.issueDate<=to); }
function chargebacksInRange(from,to){ return store.clients.filter(c => c.chargebackDate && c.chargebackDate>=from && c.chargebackDate<=to).reduce((s,c)=>s+c.chargebackAmount,0); }
function costsTotalInRange(from,to){ return costsInRange(from,to).reduce((s,c)=>s+c.amount,0); }
function pendingAsOf(to){ return store.clients.filter(c => c.status==='pending' && c.dateSubmitted<=to).reduce((s,c)=>s+annualPremium(c),0); }
function statement(from,to){
  const gross = grossFYCInRange(from,to);
  const cb = chargebacksInRange(from,to);
  const netCommission = gross - cb;
  const costsTotal = costsTotalInRange(from,to);
  const netProfit = netCommission - costsTotal;
  const pending = pendingAsOf(to);
  return { gross, cb, netCommission, costsTotal, netProfit, pending };
}

/* ============================================================
   shared date-range report filter (Desk, Activity, Book, Costs, Profit)
   ============================================================ */
const DATE_RANGE_PRESETS = [
  ['today','Today'], ['yesterday','Yesterday'], ['this_week','This week'], ['this_month','This month'],
  ['last_month','Last month'], ['this_quarter','This quarter'], ['ytd','Year to date'], ['custom','Custom'],
];
const dateFilterState = {
  desk: { key: 'this_month', from: '', to: '' },
  activity: { key: 'this_month', from: '', to: '' },
  book: { key: 'ytd', from: '', to: '' },
  costs: { key: 'this_month', from: '', to: '' },
  profit: { key: 'this_month', from: '', to: '' },
};
function computeDateRange(key, customFrom, customTo){
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth(), d = now.getDate();
  switch (key) {
    case 'today': { const t = toISO(now); return { from: t, to: t }; }
    case 'yesterday': { const t = toISO(new Date(y,m,d-1)); return { from: t, to: t }; }
    case 'this_week': { const start = new Date(y,m,d - now.getDay()); return { from: toISO(start), to: toISO(now) }; }
    case 'last_month': return { from: toISO(new Date(y,m-1,1)), to: toISO(new Date(y,m,0)) };
    case 'this_quarter': { const q = Math.floor(m/3); return { from: toISO(new Date(y,q*3,1)), to: toISO(now) }; }
    case 'ytd': return { from: toISO(new Date(y,0,1)), to: toISO(now) };
    case 'custom': return { from: customFrom || toISO(new Date(y,m,1)), to: customTo || toISO(now) };
    case 'this_month': default: return { from: toISO(new Date(y,m,1)), to: toISO(now) };
  }
}
function dateFilterHTML(pageKey){
  const state = dateFilterState[pageKey];
  const range = computeDateRange(state.key, state.from, state.to);
  return `
  <div class="date-filter" data-page="${pageKey}">
    <select class="date-filter-select">
      ${DATE_RANGE_PRESETS.map(([k,label]) => `<option value="${k}" ${state.key===k?'selected':''}>${label}</option>`).join('')}
    </select>
    <span class="date-filter-custom${state.key==='custom' ? '' : ' section-hidden'}">
      <input type="date" class="date-filter-from" value="${range.from}">
      <span>to</span>
      <input type="date" class="date-filter-to" value="${range.to}">
      <button type="button" class="ghost date-filter-apply">Apply</button>
    </span>
    <span class="date-filter-range helptext">${fmtDateShort(range.from)} – ${fmtDateShort(range.to)}</span>
  </div>`;
}
function wireDateFilter(pageKey, onChange){
  const wrap = mainInner.querySelector(`.date-filter[data-page="${pageKey}"]`);
  if (!wrap) return;
  const state = dateFilterState[pageKey];
  const select = wrap.querySelector('.date-filter-select');
  const custom = wrap.querySelector('.date-filter-custom');
  select.onchange = () => {
    state.key = select.value;
    if (state.key === 'custom') { custom.classList.remove('section-hidden'); return; }
    onChange();
  };
  wrap.querySelector('.date-filter-apply').onclick = () => {
    state.from = wrap.querySelector('.date-filter-from').value;
    state.to = wrap.querySelector('.date-filter-to').value;
    onChange();
  };
}

/* ============================================================
   modal helper
   ============================================================ */
function openModal(innerHTML, opts){
  closeModal();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'activeModal';
  overlay.innerHTML = `<div class="modal-box${opts && opts.wide ? ' modal-wide' : ''}">${innerHTML}</div>`;
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
  document.body.appendChild(overlay);
  return overlay;
}
function closeModal(){ const m = document.getElementById('activeModal'); if (m) m.remove(); }

/* ---- today's tally lives alongside the rest of the store ---- */
function todayRow(){
  let row = store.activity.find(r => r.date === todayISO());
  if (!row) { row = { date: todayISO(), dials:0, appointments:0, presentations:0, sales:0 }; store.activity.push(row); }
  return row;
}
function bump(field, delta){
  const row = todayRow();
  row[field] = Math.max(0, row[field] + delta);
  saveStore();
  renderCurrentPage();
}

const mainInner = document.getElementById('mainInner');

/* ================= DESK ================= */
function renderDesk(){
  const range = computeDateRange(dateFilterState.desk.key, dateFilterState.desk.from, dateFilterState.desk.to);
  const st = statement(range.from, range.to);
  const funnel = sumActivity(activityInRange(range.from, range.to));
  const t = todayRow();
  const placedAll = store.clients.filter(c => c.status==='issued'||c.status==='lapsed').length;

  const monthFrom = toISO(new Date(new Date().getFullYear(), new Date().getMonth(), 1));
  const monthTo = todayISO();
  const monthActivity = sumActivity(activityInRange(monthFrom, monthTo));
  const monthFYC = grossFYCInRange(monthFrom, monthTo);
  const GOALS = { dials:[monthActivity.dials,4000], appointments:[monthActivity.appointments,160], sits:[monthActivity.presentations,120], sales:[monthActivity.sales,20], fyc:[monthFYC,15000] };

  const recent = [...store.clients].sort((a,b)=>new Date(b.dateSubmitted)-new Date(a.dateSubmitted)).slice(0,5);
  const costLines = COST_CATEGORIES.map(c => ({ cat:c.key, color:c.color, total: costsInRange(range.from,range.to).filter(e=>e.category===c.key).reduce((s,e)=>s+e.amount,0) })).filter(c=>c.total>0);

  mainInner.innerHTML = `
    <div class="page-header"><div><div class="page-eyebrow">Desk</div><h1>Sample producer's book</h1></div>
    <button class="ghost" type="button" id="addClientBtn">+ Add a client</button></div>

    ${dateFilterHTML('desk')}

    <div class="grid" style="margin-bottom:18px;">
      <div class="card"><div class="stat-label">Net Profit</div><div class="stat-value ${st.netProfit>=0?'pos':'neg'}">${fmt(st.netProfit)}</div><div class="stat-sub">After chargebacks and costs</div></div>
      <div class="card"><div class="stat-label">Gross Commission</div><div class="stat-value">${fmt(st.gross)}</div><div class="stat-sub">${placedAll} placed · ${fmt(st.pending)} pending</div></div>
      <div class="card"><div class="stat-label">Chargebacks</div><div class="stat-value neg">−${fmt(st.cb)}</div><div class="stat-sub">${store.clients.filter(c=>c.status==='lapsed').length} lapsed</div></div>
      <div class="card"><div class="stat-label">Operating Costs</div><div class="stat-value">${fmt(st.costsTotal)}</div><div class="stat-sub">${fmt(st.costsTotal/(funnel.sales||1))} / sale</div></div>
    </div>

    <div class="panel">
      <h2>Today</h2>
      <div class="stepper-grid">
        ${['dials','appointments','presentations','sales'].map(f => `
          <div class="stepper-box">
            <button class="stepper-btn" onclick="bump('${f}',-1)">−</button>
            <div class="count-wrap"><span class="count" id="today-${f}">${t[f]}</span><span class="count-label">${f}</span></div>
            <button class="stepper-btn" onclick="bump('${f}',1)">+</button>
          </div>`).join('')}
      </div>
    </div>

    <div class="panel">
      <h2>Production funnel</h2>
      <p class="helptext" style="margin:-8px 0 14px;">${funnel.dials} dials · ${funnel.appointments} set · ${funnel.presentations} sits · ${funnel.sales} sales (${fmtDateShort(range.from)}–${fmtDateShort(range.to)})</p>
      ${funnelRow('Dials', funnel.dials, funnel.dials, null)}
      ${funnelRow('Appointments set', funnel.appointments, funnel.dials, pct(funnel.appointments,funnel.dials))}
      ${funnelRow('Presentations', funnel.presentations, funnel.dials, pct(funnel.presentations,funnel.appointments))}
      ${funnelRow('Sales', funnel.sales, funnel.dials, pct(funnel.sales,funnel.presentations))}
      <p class="helptext">${pct(funnel.sales,funnel.dials)} of dials became a sale.</p>

      <div class="goal-grid">
        ${goalCell('Dials', GOALS.dials)}
        ${goalCell('Appts', GOALS.appointments)}
        ${goalCell('Sits', GOALS.sits)}
        ${goalCell('Sales', GOALS.sales)}
        ${goalCell('FYC', GOALS.fyc, true)}
      </div>
      <p class="helptext" style="margin-top:10px;">This month vs. a sample goal — unaffected by the date filter above.</p>
    </div>

    <div class="panel">
      <h2>Net by month</h2>
      <p class="helptext" style="margin:-8px 0 14px;">Commission minus chargebacks and overhead</p>
      <div class="chart-box"><canvas id="netChart"></canvas></div>
    </div>

    <div class="panel">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;"><h2 style="margin:0;">Recent cases</h2><a href="#" onclick="go('book');return false;" style="font-size:.85rem; font-weight:700; color:var(--maroon); text-decoration:none;">Open book</a></div>
      ${recent.map(caseRow).join('')}
    </div>

    <div class="panel">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;"><h2 style="margin:0;">Where the money goes</h2><a href="#" onclick="go('costs');return false;" style="font-size:.85rem; font-weight:700; color:var(--maroon); text-decoration:none;">All costs</a></div>
      ${costLines.length ? donutBlock(costLines) : '<p class="helptext">No costs logged in this range.</p>'}
    </div>
  `;

  wireDateFilter('desk', renderDesk);
  document.getElementById('addClientBtn').onclick = openAddClientModal;
  renderNetChart(monthlyStats(6).map(m=>m.net), monthlyStats(6).map(m=>m.label));
  if (costLines.length) renderDonut('donutCanvas', costLines);
}

function funnelRow(label, value, total, conv){
  return `<div class="funnel-row">
    <div class="row-top"><span>${label}</span><span>${value}${conv ? ` <span class="conv">· ${conv} conv</span>`:''}</span></div>
    <div class="bar-track"><div class="bar-fill" style="width:${total ? Math.min(100,(value/total*100)) : 0}%"></div></div>
  </div>`;
}
function goalCell(label, [have, target], isMoney){
  const pctVal = target ? Math.min(100, (have/target)*100) : 0;
  return `<div class="goal-cell">
    <div class="glabel">${label}</div>
    <div class="gvalue">${isMoney ? fmt(have) : have} / ${isMoney ? fmt(target) : target}</div>
    <div class="bar-track"><div class="bar-fill" style="width:${pctVal}%"></div></div>
  </div>`;
}
function caseRow(c){
  const tagClass = c.status === 'issued' ? 'active-pol' : c.status === 'lapsed' ? 'lapsed' : 'pending';
  const tagLabel = c.status === 'issued' ? 'Issued — paid' : c.status === 'lapsed' ? 'Lapsed' : 'Pending';
  return `<div class="case-card">
    <div><button class="case-name-link" onclick="openClientDetail('${c.id}')">${c.name}</button><div class="case-sub">${c.product} · ${c.carrier} · ${fmtDateShort(c.dateSubmitted)}</div></div>
    <div class="case-right">
      <div class="case-amount">${fmt(c.status === 'pending' ? annualPremium(c) : c.monthlyPremium*12)}</div>
      <div style="margin-top:4px;"><span class="tag ${tagClass}">${tagLabel}</span>${c.chargebackAmount ? ` <span class="helptext" style="color:var(--red);">−${fmt(c.chargebackAmount)} CB</span>`:''}</div>
    </div>
  </div>`;
}
function donutBlock(costLines){
  return `<div class="donut-wrap">
    <div class="chart-box" style="width:180px; height:180px; flex-shrink:0;"><canvas id="donutCanvas"></canvas></div>
    <div class="donut-legend">
      ${costLines.map(c => `<div class="donut-legend-row"><span><span class="dot" style="background:${c.color}"></span>${c.cat}</span><span>${fmt(c.total)}</span></div>`).join('')}
    </div>
  </div>`;
}

let netChart, donutChart, activityChart;
function renderNetChart(data, labels){
  const ctx = document.getElementById('netChart');
  if (!ctx) return;
  if (netChart) netChart.destroy();
  netChart = new Chart(ctx, { type:'line', data:{ labels, datasets:[{
    data, borderColor:'#1B7A73', backgroundColor:'rgba(27,122,115,.15)',
    fill:true, tension:.45, cubicInterpolationMode:'monotone', pointRadius:0,
  }]}, options:{ responsive:true, maintainAspectRatio:false,
    plugins:{ legend:{ display:false } },
    scales:{ x:{ ticks:{ color:getComputedStyle(document.body).color } }, y:{ ticks:{ color:getComputedStyle(document.body).color } } } } });
}
function renderDonut(id, costLines){
  const ctx = document.getElementById(id);
  if (!ctx) return;
  if (donutChart) donutChart.destroy();
  donutChart = new Chart(ctx, { type:'doughnut', data:{
    labels: costLines.map(c=>c.cat), datasets:[{ data: costLines.map(c=>c.total), backgroundColor: costLines.map(c=>c.color) }]
  }, options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ display:false } }, cutout:'68%' } });
}

function monthBuckets(count){
  const months = [];
  const now = new Date();
  for (let i = count-1; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const start = toISO(d);
    const end = toISO(new Date(now.getFullYear(), now.getMonth()-i+1, 0));
    months.push({ label: d.toLocaleString(undefined,{month:'short', year: count>12?'2-digit':undefined}), start, end });
  }
  return months;
}
function monthlyStats(count){
  return monthBuckets(count).map(m => {
    const act = sumActivity(activityInRange(m.start,m.end));
    const gross = grossFYCInRange(m.start,m.end);
    const cb = chargebacksInRange(m.start,m.end);
    const cost = costsTotalInRange(m.start,m.end);
    return { label:m.label, dials:act.dials, sales:act.sales, gross, cb, cost, net: gross-cb-cost };
  });
}

    </div>

    <div class="panel">
      <h2>Unit economics</h2>
      <p class="helptext" style="margin:-8px 0 14px;">${fmtDateShort(range.from)} – ${fmtDateShort(range.to)}</p>
      <div class="metrics-grid">
        <div class="metric-cell"><div class="mlabel">Cost per Sale</div><div class="mvalue">${fmt(costPerSale)}</div></div>
        <div class="metric-cell"><div class="mlabel">Commission per Dial</div><div class="mvalue">${fmtMoney2(commissionPerDial)}</div></div>
        <div class="metric-cell"><div class="mlabel">Cost per Appointment</div><div class="mvalue">${fmt(costPerAppointment)}</div></div>
        <div class="metric-cell"><div class="mlabel">Cost per Dial</div><div class="mvalue">${fmtMoney2(costPerDial)}</div></div>
        <div class="metric-cell"><div class="mlabel">Average Case FYC</div><div class="mvalue">${fmt(avgCaseFYC)}</div></div>
        <div class="metric-cell"><div class="mlabel">Average Annual Premium</div><div class="mvalue">${fmt(avgAnnualPremium)}</div></div>
      </div>
    </div>

    <div class="panel">
      <h2>Health of the book</h2>
      <p class="helptext" style="margin:-8px 0 14px;">Whole book, all time — not affected by the date filter above</p>
      <table class="statement-table">
        <tbody>
          <tr><td>Profit margin on gross FYC</td><td>${profitMargin.toFixed(1)}%</td></tr>
          <tr><td>Chargeback ratio</td><td class="${chargebackRatio>10?'neg':''}">${chargebackRatio.toFixed(1)}%</td></tr>
          <tr><td>Persistency (12+ months on the books)</td><td class="pos">${persistency}%</td></tr>
        </tbody>
      </table>
    </div>

    <div class="panel">
      <h2>Month over month</h2>
      <table><thead><tr><th>Month</th><th>Dials</th><th>Sales</th><th>Gross Commission</th><th>Chargebacks</th><th>Costs</th><th>Net Profit</th></tr></thead>
      <tbody>${stats.slice().reverse().map(m=>`<tr><td>${m.label}</td><td>${m.dials}</td><td>${m.sales}</td><td>${fmt(m.gross)}</td><td class="neg">−${fmt(m.cb)}</td><td>${fmt(m.cost)}</td><td class="${m.net>=0?'pos':'neg'}">${fmt(m.net)}</td></tr>`).join('')}</tbody></table>
    </div>
  `;
  wireDateFilter('profit', renderProfit);
  document.getElementById('trendRangeSelect').onchange = (e) => {
    const v = e.target.value;
    trendMonths = v === 'ytd' ? (new Date().getMonth()+1) : Number(v);
    renderProfit();
  };
  renderNetChart(stats.map(m=>m.net), stats.map(m=>m.label));
}

/* ---- Bob's speech bubble, wired once per page mount ---- */
let say = () => {};

/* ---- nav ---- */
const PAGES = { desk: renderDesk, activity: renderActivity, book: () => renderBook('',''), costs: renderCosts, profit: renderProfit };
let currentPage = 'desk';
function renderCurrentPage(){ PAGES[currentPage](); }
function go(page){
  currentPage = page;
  document.querySelectorAll('#sidebarNav button').forEach(b => b.classList.toggle('active', b.dataset.page === page));
  PAGES[page]();
}
document.querySelectorAll('#sidebarNav button').forEach(b => b.onclick = () => go(b.dataset.page));

document.getElementById('resetDemoBtn').onclick = () => {
  if (!confirm('Reset the sample book back to its original demo data? This clears everything you added in this browser.')) return;
  localStorage.removeItem(STORE_KEY);
  store = loadStore();
  renderCurrentPage();
};

say = wireMascot('navMascot', ["Hi, I'm Bob!", "This is a sample book — try the real thing!", "Edits here stay in your browser."]);
go('desk');
</script>
</body>
</html>
