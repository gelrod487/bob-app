<svg viewBox="0 0 160 210" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="coverGrad" x1="0.1" y1="0" x2="0.95" y2="1">
      <stop offset="0%" stop-color="#A5303A"/>
      <stop offset="30%" stop-color="#8C1F2A"/>
      <stop offset="75%" stop-color="#711A24"/>
      <stop offset="100%" stop-color="#5C121A"/>
    </linearGradient>
    <linearGradient id="spineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4A0F17"/>
      <stop offset="45%" stop-color="#6E1820"/>
      <stop offset="100%" stop-color="#7E1E27"/>
    </linearGradient>
    <linearGradient id="limbGrad" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#9C2730"/>
      <stop offset="100%" stop-color="#711A24"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBE6AE"/>
      <stop offset="50%" stop-color="#EAB350"/>
      <stop offset="100%" stop-color="#B57A22"/>
    </linearGradient>
    <linearGradient id="legGrad" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#A9636D"/>
      <stop offset="100%" stop-color="#8C4750"/>
    </linearGradient>
    <radialGradient id="pageLight" cx="26%" cy="16%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".32"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ao" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3A0B10" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#3A0B10" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurSm" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="blurLg" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <ellipse cx="82" cy="201" rx="38" ry="6.5" fill="#3A0B10" opacity=".22" filter="url(#blurLg)"/>

  <!-- back arm (waving) -->
  <g>
    <path d="M110 98 Q140 85 138 56" stroke="url(#limbGrad)" stroke-width="14.5" fill="none" stroke-linecap="round"/>
    <circle cx="138" cy="55" r="9.5" fill="url(#limbGrad)"/>
    <ellipse cx="112" cy="98" rx="8" ry="7" fill="url(#ao)" filter="url(#blurSm)"/>
    <animateTransform attributeName="transform" type="rotate" additive="sum"
      values="0 110 98; -14 110 98; 10 110 98; -11 110 98; 0 110 98"
      keyTimes="0; 0.25; 0.55; 0.8; 1" dur="1.9s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1; 0.45 0 0.55 1; 0.45 0 0.55 1"/>
  </g>

  <!-- front arm (resting near hip) -->
  <path d="M45 108 Q28 121 34 140" stroke="url(#limbGrad)" stroke-width="14.5" fill="none" stroke-linecap="round"/>
  <circle cx="34" cy="141" r="9.5" fill="url(#limbGrad)"/>
  <ellipse cx="47" cy="107" rx="8" ry="7" fill="url(#ao)" filter="url(#blurSm)"/>

  <!-- legs -->
  <ellipse cx="65" cy="176" rx="9.5" ry="6" fill="url(#ao)" filter="url(#blurSm)"/>
  <ellipse cx="97" cy="176" rx="9.5" ry="6" fill="url(#ao)" filter="url(#blurSm)"/>
  <rect x="57" y="176" width="16" height="24" rx="7.5" fill="url(#legGrad)"/>
  <rect x="89" y="176" width="16" height="24" rx="7.5" fill="url(#legGrad)"/>
  <ellipse cx="65" cy="201" rx="11" ry="5" fill="#4A2126"/>
  <ellipse cx="97" cy="201" rx="11" ry="5" fill="#4A2126"/>

  <!-- spine (a soft rounded bevel, not a separate flap, for a real turned-book edge) -->
  <path d="M42 46 Q31 50 31 60 L31 158 Q31 168 42 172 Z" fill="url(#spineGrad)"/>

  <!-- front cover -->
  <rect x="38" y="42" width="86" height="132" rx="11" fill="url(#coverGrad)"/>
  <rect x="46" y="50" width="70" height="116" rx="6" fill="none" stroke="url(#gold)" stroke-width="2"/>
  <rect x="38" y="42" width="86" height="132" rx="11" fill="url(#pageLight)"/>

  <!-- gold seal -->
  <circle cx="100" cy="141" r="11.5" fill="url(#gold)"/>
  <circle cx="100" cy="141" r="11.5" fill="none" stroke="#8A5A14" stroke-width=".8" opacity=".5"/>
  <circle cx="96.5" cy="137.5" r="2" fill="#FFF6DD" opacity=".6"/>

  <!-- face -->
  <g>
    <ellipse cx="63" cy="90" rx="5.2" ry="6.6" fill="#FBEFE4"/>
    <ellipse cx="93" cy="90" rx="5.2" ry="6.6" fill="#FBEFE4"/>
    <circle cx="64" cy="92" r="3.1" fill="#2B1013"/>
    <circle cx="94" cy="92" r="3.1" fill="#2B1013"/>
    <circle cx="65.1" cy="90.2" r="1" fill="#FFFFFF"/>
    <circle cx="95.1" cy="90.2" r="1" fill="#FFFFFF"/>
    <ellipse cx="58" cy="102" rx="5.5" ry="3.4" fill="#B5677A" opacity=".4"/>
    <ellipse cx="99" cy="102" rx="5.5" ry="3.4" fill="#B5677A" opacity=".4"/>
    <path d="M61 107 Q78.5 119.5 96 107" stroke="#4A0F17" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  </g>
</svg>
