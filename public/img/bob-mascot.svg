<svg viewBox="0 0 160 210" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="coverGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C23B4A"/>
      <stop offset="55%" stop-color="#9C2635"/>
      <stop offset="100%" stop-color="#711A26"/>
    </linearGradient>
    <linearGradient id="spineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8A2230"/>
      <stop offset="100%" stop-color="#5A1420"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B8323F"/>
      <stop offset="100%" stop-color="#8A2230"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE29A"/>
      <stop offset="55%" stop-color="#F0B23C"/>
      <stop offset="100%" stop-color="#C4841C"/>
    </linearGradient>
    <linearGradient id="legGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F17FA8"/>
      <stop offset="100%" stop-color="#E85D8E"/>
    </linearGradient>
    <radialGradient id="pageLight" cx="30%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <ellipse cx="82" cy="200" rx="40" ry="7" fill="#5A1220" opacity=".18" filter="url(#softShadow)"/>

  <!-- back arm (waving) -->
  <g>
    <path d="M112 96 Q144 82 141 54" stroke="url(#bodyGrad)" stroke-width="15" fill="none" stroke-linecap="round"/>
    <circle cx="141" cy="53" r="10.5" fill="url(#bodyGrad)"/>
    <animateTransform attributeName="transform" type="rotate" additive="sum"
      values="0 112 96; -14 112 96; 10 112 96; -11 112 96; 0 112 96"
      keyTimes="0; 0.25; 0.55; 0.8; 1" dur="1.9s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1; 0.45 0 0.55 1; 0.45 0 0.55 1"/>
  </g>

  <!-- front arm (resting near hip) -->
  <path d="M44 108 Q26 122 32 142" stroke="url(#bodyGrad)" stroke-width="15" fill="none" stroke-linecap="round"/>
  <circle cx="32" cy="143" r="10.5" fill="url(#bodyGrad)"/>

  <!-- legs -->
  <rect x="56" y="176" width="17" height="26" rx="8" fill="url(#legGrad)"/>
  <rect x="90" y="176" width="17" height="26" rx="8" fill="url(#legGrad)"/>
  <ellipse cx="64" cy="204" rx="12" ry="5.5" fill="#6E1A30"/>
  <ellipse cx="98" cy="204" rx="12" ry="5.5" fill="#6E1A30"/>

  <!-- spine, angled to read as a 3D turn of the book -->
  <path d="M30 50 L46 44 L46 168 L30 176 Z" fill="url(#spineGrad)"/>
  <path d="M30 50 L46 44 L46 168 L30 176 Z" fill="url(#pageLight)"/>

  <!-- front cover -->
  <rect x="46" y="42" width="82" height="130" rx="10" fill="url(#coverGrad)"/>
  <rect x="53" y="49" width="68" height="116" rx="6" fill="none" stroke="url(#gold)" stroke-width="2.2"/>
  <rect x="46" y="42" width="82" height="130" rx="10" fill="url(#pageLight)"/>

  <!-- gold seal -->
  <circle cx="104" cy="140" r="12" fill="url(#gold)"/>
  <circle cx="104" cy="140" r="12" fill="none" stroke="#9C6A12" stroke-width="1" opacity=".5"/>

  <!-- face -->
  <g>
    <ellipse cx="66" cy="88" rx="5.5" ry="7" fill="#FFFFFF"/>
    <ellipse cx="96" cy="88" rx="5.5" ry="7" fill="#FFFFFF"/>
    <circle cx="67" cy="90" r="3.4" fill="#2B1013"/>
    <circle cx="97" cy="90" r="3.4" fill="#2B1013"/>
    <circle cx="68.3" cy="88" r="1.1" fill="#FFFFFF"/>
    <circle cx="98.3" cy="88" r="1.1" fill="#FFFFFF"/>
    <ellipse cx="60" cy="101" rx="6" ry="4" fill="#FF8FA3" opacity=".55"/>
    <ellipse cx="102" cy="101" rx="6" ry="4" fill="#FF8FA3" opacity=".55"/>
    <path d="M64 106 Q81 120 98 106" stroke="#5A1220" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
</svg>
